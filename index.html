<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREA(I) — Real Estate Payment & Membership Management Suite</title>
  <link rel="icon" type="image/jpeg" href="assets/crea_logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/jsqr.min.js"></script>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/fontkit.umd.min.js"></script>
  <script>
    if (typeof qrcode === 'undefined') {
      const s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js";
      document.head.appendChild(s);
    }
    if (typeof jsQR === 'undefined') {
      const s2 = document.createElement('script');
      s2.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
      document.head.appendChild(s2);
    }
    if (typeof PDFLib === 'undefined') {
      const s3 = document.createElement('script');
      s3.src = "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";
      document.head.appendChild(s3);
    }
  </script>
  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: #0d1527;
      --card-border: #1e293d;
      --card-hover: #162035;
      --primary: #2563eb;
      --primary-light: #38bdf8;
      --primary-dark: #1d4ed8;
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Notice Bar */
    .top-strip {
      background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 8px 24px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .top-strip .tag {
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Navigation Header */
    header {
      background: rgba(13, 21, 39, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text p {
      font-size: 11.5px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      background: #090f1d;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .nav-btn.active {
      background: #1e293b;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }

    .nav-btn:hover:not(.active) {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.04);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px 24px;
    }

    /* Cards & Containers */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .glass-card:hover {
      border-color: #2b3a55;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-member { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-associate_member { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-new_member { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-board_member { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-non_member { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-paid { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-open { background: rgba(37, 99, 235, 0.15); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.3); }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-deactivated { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }

    @keyframes scanLaser {
      0% { top: 6%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 6%; opacity: 0.8; }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.16s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    }
    .btn-success:hover {
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: #27354a;
      color: #ffffff;
    }

    .btn-outline {
      background: transparent;
      color: var(--primary-light);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Grid Layouts */
    .heads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .head-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }
    .head-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-box {
      background: #0e1629;
      border: 1px solid #1f2d47;
      border-radius: 18px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      padding: 28px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .modal-close:hover { color: #ffffff; }

    /* Inputs */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      background: #090f1e;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary-light);
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      background: #090f1d;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--card-border);
    }

    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #141f33;
      color: #e2e8f0;
    }

    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .data-table tfoot td {
      background: #080e1d;
      color: #ffffff;
      padding: 13px 14px;
      border-top: 2px solid rgba(56, 189, 248, 0.45);
      border-bottom: 2px solid rgba(56, 189, 248, 0.45);
    }

    /* Print Invoice Styling */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-invoice-container, #printable-invoice-container * {
        visibility: visible;
      }
      #printable-invoice-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 20px !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>

      data: null, // Will load from server or fallback localStorage

      async init() {
        // Fresh Session Enforcement: Wipe all previous logins on initial visit/refresh
        localStorage.removeItem("crea_member");
        sessionStorage.clear();
        this.loggedInMember = null;
        this.isAdminAuthenticated = false;
        this.currentTab = "admin";

        // Fetch data from local Node server or fallback
        try {
          const res = await fetch("/api/data");
          if (res.ok) {
            const json = await res.json();
            // Merge with any payments and updated counters stored locally
            const localRaw = localStorage.getItem("crea_data_store");
            if (localRaw) {
              try {
                const local = JSON.parse(localRaw);
                const serverPayments = (json.data && json.data.payments) || [];
                const localPayments = (local && local.payments) || [];
                const mergedPayments = [...serverPayments];
                for (const lp of localPayments) {
                  if (!mergedPayments.some(sp => (sp.invoiceNo && lp.invoiceNo && sp.invoiceNo === lp.invoiceNo) || (sp.id && lp.id && sp.id === lp.id))) {
                    mergedPayments.unshift(lp);
                  }
                }
                if (json.data) {
                  json.data.payments = mergedPayments;
                  if (local.invoiceCounter && local.invoiceCounter > (json.data.invoiceCounter || 0)) {
                    json.data.invoiceCounter = local.invoiceCounter;
                  }
                }
              } catch(parseErr) {
                console.warn("Could not parse local data store:", parseErr);
              }
            }
            this.data = json.data;
          } else {
            throw new Error("Local API offline");
          }
        } catch (e) {
          console.log("Using browser offline storage");
          this.loadFromStorage();
        }

        // Ensure heads and members are fully normalized and reconciled with payments
        const brandLogo = document.getElementById("main-brand-logo"); if (brandLogo && this.logo) brandLogo.src = this.logo;
        this.normalizeData();

        // Default landing strictly on Admin Authentication Portal
        this.switchTab("admin");
        this.startAutoSync();
      },

      loadFromStorage() {
        const stored = localStorage.getItem("crea_data_store");
        if (stored) {
          this.data = JSON.parse(stored);
        } else {
          // Initialize default store
          this.data = this.getDefaultStore();
          this.saveToStorage();
        }
        this.normalizeData();
      },

      getFinancialYear(date = new Date()) {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = d.getMonth() + 1; // 1-12
        let startYear, endYear;
        if (month >= 4) {
          startYear = year;
          endYear = year + 1;
        } else {
          startYear = year - 1;
          endYear = year;
        }
        const startStr = String(startYear).slice(-2);
        const endStr = String(endYear).slice(-2);
        return {
          code: `${startStr}${endStr}`,
          label: `FY ${startYear}-${String(endYear).slice(-2)}`,
          fullLabel: `${startYear}-${endYear}`,
          startYear,
          endYear
        };
      },

      getTodayDateOnly() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      },

      getEventDateOnly(dateVal) {
        if (!dateVal) return null;
        if (typeof dateVal === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateVal.trim())) {
          return dateVal.trim();
        }
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return null;
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      },

      isEventToday(eventDate) {
        if (!eventDate) return false;
        return this.getEventDateOnly(eventDate) === this.getTodayDateOnly();
      },

      isHeadLive(head) {
        if (!head) return false;
        if (head.isLive === true) return true;
        if (head.prices && head.prices.is_live === true) return true;
        if (head.eventDate && this.isEventToday(head.eventDate)) return true;
        return false;
      },

      async toggleHeadLive(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;
        const currentLive = this.isHeadLive(head);
        const newLiveState = !currentLive;
        head.isLive = newLiveState;
        if (head.prices) head.prices.is_live = newLiveState;
        this.saveToStorage();

        // If inside delegate tracker, re-render it
        if (this._currentTrackerHeadId === headId && document.getElementById("delegate-tracker-table")) {
          const searchInput = document.getElementById("roster-search");
          this.openDelegateTracker(headId, searchInput ? searchInput.value : '');
        } else {
          this.render();
        }

        try {
          const res = await fetch("/api/head", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: headId,
              isLive: newLiveState,
              action: "toggle_live"
            })
          });
          const json = await res.json();
          if (json && json.head) {
            head.isLive = Boolean(json.head.isLive);
            this.saveToStorage();
          }
        } catch(e) {
          console.warn("Failed to toggle live status on server:", e);
        }
      },

      async toggleHeadGift(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;
        const currentGift = Boolean(head.giftEnabled);
        const newGiftState = !currentGift;
        head.giftEnabled = newGiftState;
        if (head.prices) head.prices.gift_enabled = newGiftState;
        this.saveToStorage();

        // If inside delegate tracker, re-render it
        if (this._currentTrackerHeadId === headId && document.getElementById("delegate-tracker-table")) {
          const searchInput = document.getElementById("roster-search");
          this.openDelegateTracker(headId, searchInput ? searchInput.value : '');
        } else {
          this.render();
        }

        try {
          const res = await fetch("/api/head", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: headId,
              giftEnabled: newGiftState,
              action: "toggle_gift"
            })
          });
          const json = await res.json();
          if (json && json.head) {
            head.giftEnabled = Boolean(json.head.giftEnabled);
            this.saveToStorage();
          }
        } catch(e) {
          console.warn("Failed to toggle gift status on server:", e);
        }
      },

      startAutoSync() {
        if (this._syncInterval) clearInterval(this._syncInterval);

        const doSync = async () => {
          // If a modal form or camera scanner is active, do not disturb user typing or camera
          const isScannerActive = !!document.getElementById("scanner-video");
          const editModal = document.getElementById("edit-head-title");
          const newHeadModal = document.getElementById("head-title");
          const editMemberModal = document.getElementById("edit-mem-name");
          const newMemberModal = document.getElementById("mem-name");
          if (isScannerActive || editModal || newHeadModal || editMemberModal || newMemberModal) {
            return;
          }

          try {
            const res = await fetch(`/api/data?_=${Date.now()}`, {
              cache: "no-store",
              headers: { "Cache-Control": "no-cache", "Pragma": "no-cache" }
            });
            if (!res.ok) return;
            const json = await res.json();
            if (!json || !json.data) return;

            const serverData = json.data;
            let dataUpdated = false;

            // 1. Sync Heads (dates, live flags, prices)
            if (JSON.stringify(serverData.heads || []) !== JSON.stringify(this.data.heads || [])) {
              this.data.heads = serverData.heads || [];
              dataUpdated = true;
            }

            // 2. Sync Payments (attendances, gifts, new transactions)
            if (JSON.stringify(serverData.payments || []) !== JSON.stringify(this.data.payments || [])) {
              this.data.payments = serverData.payments || [];
              dataUpdated = true;
            }

            // 3. Sync Members
            if (JSON.stringify(serverData.members || []) !== JSON.stringify(this.data.members || [])) {
              this.data.members = serverData.members || [];
              dataUpdated = true;
            }

            if (dataUpdated) {
              this.saveToStorage();
              // Check if Delegate Tracker is currently open
              const trackerTable = document.getElementById("delegate-tracker-table");
              if (trackerTable && this._currentTrackerHeadId) {
                const searchInput = document.getElementById("roster-search");
                this.openDelegateTracker(this._currentTrackerHeadId, searchInput ? searchInput.value : '');
              } else if (!document.getElementById("modal-root")?.innerHTML.trim()) {
                this.render();
              }
            }
          } catch(err) {
            // Silently ignore temporary network drops
          }
        };

        // Poll every 3.5 seconds
        this._syncInterval = setInterval(doSync, 3500);

        // Immediate sync when mobile tab or device wakes up
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") doSync();
        });
        window.addEventListener("focus", () => {
          doSync();
        });
      },

      getHeadPrice(head, category) {
        if (!head || !head.prices) return null;
        const cat = category || 'member';
        const val = head.prices[cat];
        if (val !== null && val !== undefined && val !== "") return Number(val);

        const isMem = head.code === 'MEM' || head.type === 'membership' || (head.title && head.title.toLowerCase().includes('membership'));

        // Associate Member fallback: inherits member rate for trainings and events
        if (cat === 'associate_member' || cat === 'new_member') {
          if (head.prices.associate_member !== null && head.prices.associate_member !== undefined && head.prices.associate_member !== "") {
            return Number(head.prices.associate_member);
          }
          if (head.prices.new_member !== null && head.prices.new_member !== undefined && head.prices.new_member !== "") {
            return Number(head.prices.new_member);
          }
          if (!isMem && head.prices.member !== null && head.prices.member !== undefined && head.prices.member !== "") {
            return Number(head.prices.member);
          }
          if (isMem) return 5000;
        }

        // Board member fallback
        if (cat === 'board_member') {
          if (head.prices.member !== null && head.prices.member !== undefined && head.prices.member !== "") {
            return Number(head.prices.member);
          }
        }

        return null;
      },

      cleanMobile(mob) {
        if (!mob) return '';
        const digits = String(mob).replace(/\D/g, '');
        return digits.length >= 10 ? digits.slice(-10) : digits;
      },

      isPaymentForMember(payment, member) {
        if (!payment || !member) return false;
        if (payment.payerId && member.id && String(payment.payerId).trim() === String(member.id).trim()) {
          return true;
        }
        const pMob = this.cleanMobile(payment.payerMobile);
        const mMob = this.cleanMobile(member.mobile);
        if (pMob && mMob && pMob === mMob) {
          return true;
        }
        if (payment.payerEmail && member.email) {
          const pEmail = String(payment.payerEmail).trim().toLowerCase();
          const mEmail = String(member.email).trim().toLowerCase();
          if (pEmail && mEmail && pEmail === mEmail) {
            return true;
          }
        }
        return false;
      },

      findMember(query) {
        if (!query || !this.data || !this.data.members) return null;
        if (typeof query === 'object') {
          return this.data.members.find(m =>
            (query.id && m.id === query.id) ||

      hasPaidMembershipForFY(member, fyCode) {
        if (!member) return false;
        const fy = fyCode || this.getFinancialYear().code;

        // Ensure we check against fresh data in this.data.members if available
        const memObj = this.findMember(member) || member;

        // 1. Check successful membership payments in the current FY
        const hasPayment = (this.data.payments || []).some(p => {
          if (p.status !== 'success') return false;
          if (!this.isPaymentForMember(p, memObj)) return false;

          const isMemHead = p.headCode === 'MEM' ||
            (p.headTitle && p.headTitle.toLowerCase().includes('membership')) ||
            (p.invoiceNo && p.invoiceNo.includes('/MEM/'));
          if (!isMemHead) return false;

          if (p.invoiceNo && (p.invoiceNo.includes(`/${fy}/`) || p.invoiceNo.includes('/2627/'))) return true;
          if (p.headTitle && (p.headTitle.includes('2026-2027') || p.headTitle.includes('2026-27'))) return true;
          if (p.date && new Date(p.date) >= new Date('2026-04-01')) return true;
          return true; // Any successful membership payment satisfies annual membership
        });

        if (hasPayment) return true;

        // 2. Check verified offline manual activation with explicit payment means (excluding generic 'Admin Direct')
        if (memObj.paymentMeans && memObj.paymentMeans !== 'Admin Direct' && memObj.lastPaidFY) {
          const s = String(typeof memObj.lastPaidFY === 'object' ? (memObj.lastPaidFY.code || memObj.lastPaidFY.label || '') : memObj.lastPaidFY);
          if (s === fy || s.includes(fy) || s.includes('2627') || s.includes('2026')) {
            return true;
          }
        }

        return false;
      },


      normalizeData() {
        if (!this.data) return;
        if (!this.data.heads) this.data.heads = [];
        this.data.heads.forEach(h => {
          if (!h.status) h.status = "active";
          if (!h.prices) h.prices = {};
          if (h.prices.new_member !== undefined && (h.prices.associate_member === undefined || h.prices.associate_member === null)) {
            h.prices.associate_member = h.prices.new_member;
          }
          const isMem = h.code === 'MEM' || h.type === 'membership' || (h.title && h.title.toLowerCase().includes('membership'));
          if (!isMem && (h.prices.associate_member === undefined || h.prices.associate_member === null || h.prices.associate_member === "")) {
            if (h.prices.member !== undefined && h.prices.member !== null && h.prices.member !== "") {
              h.prices.associate_member = Number(h.prices.member);
            }
          }
        });

        if (!this.data.members) this.data.members = [];
        const fy = this.getFinancialYear();

        const isFYPaid = (val, fyCode) => {
          if (!val) return false;
          if (typeof val === 'object') {
            const c = val.code || val.label || '';
            return String(c).includes(fyCode) || String(c).includes('2627') || String(c).includes('2026');
          }
          const s = String(val);
          return s === fyCode || s.includes(fyCode) || s.includes('2627') || s.includes('2026-2027') || s.includes('2026-27');
        };

        // Normalize Heads: ensure giftEnabled and clean prices
        (this.data.heads || []).forEach(h => {
          h.giftEnabled = Boolean(h.giftEnabled || h.gift_enabled || h.prices?.gift_enabled);
          if (h.prices && h.prices.board_member !== undefined) {
            delete h.prices.board_member;
          }
        });

        // Normalize Payments: remove legacy board_member and new_member
        (this.data.payments || []).forEach(p => {
          if (p.payerCategory === "board_member") p.payerCategory = "member";
          if (p.payerCategory === "new_member") p.payerCategory = "associate_member";
        });

        // Pass 1: Evaluate Primary Members
        this.data.members.forEach(m => {
          if (m.category === "board_member") m.category = "member";
          if (m.category === "new_member") m.category = "associate_member";
          m.reraNumber = (m.reraNumber || m.rera_number || "").trim().toUpperCase();

          if (m.category !== "associate_member") {
            const hasPaidCurrentFY = this.hasPaidMembershipForFY(m, fy.code);

            if (hasPaidCurrentFY) {
              if (m.status !== "deactivated_manual") {
                m.status = "active";
                m.lastPaidFY = fy.code;
                m.deactivationReason = null;
              }
            } else {
              // Deactivate / pending if unpaid for current FY
              if (m.status !== "active_manual") {
                m.status = "deactivated";
                m.lastPaidFY = null;
                m.deactivationReason = m.deactivationReason || `Pending ${fy.label} Annual Renewal`;
                m.activationNote = m.activationNote || `Pending ${fy.label} Annual Renewal`;
              }
            }
          }
        });

        // Pass 2: Evaluate Associate Members (DEPENDENT on Main Member!)
        this.data.members.forEach(m => {
          if (m.category === "associate_member") {
            const mainMember = this.data.members.find(p =>
              (m.parentMemberId && p.id === m.parentMemberId) ||
              (m.parentMemberMobile && this.cleanMobile(p.mobile) === this.cleanMobile(m.parentMemberMobile)) ||
              (m.parentMemberName && p.name && p.name.trim().toLowerCase() === m.parentMemberName.trim().toLowerCase())
            );

            const mainMemberHasPaid = mainMember && this.hasPaidMembershipForFY(mainMember, fy.code);
            const isMainMemberActive = mainMember && (mainMember.status === "active" || mainMemberHasPaid);

            const hasAssociatePaid = this.hasPaidMembershipForFY(m, fy.code);

            // Strict Rule: Main member MUST be active and paid.
            // If main member is unpaid, associate is DEACTIVATED irrespective of associate payment!
            if (!isMainMemberActive) {
              m.status = "deactivated";
              m.deactivationReason = `Main Member (${mainMember ? mainMember.name : (m.parentMemberName || "Linked")}) membership unpaid for ${fy.label}`;
              m.activationNote = `Deactivated: Main Member (${mainMember ? mainMember.name : (m.parentMemberName || "Linked")}) has not paid FY dues`;
            } else if (!hasAssociatePaid) {
              m.status = "deactivated";
              m.lastPaidFY = null;
              m.deactivationReason = `Associate Member renewal fee pending for ${fy.label}`;
              m.activationNote = `Pending Associate Member Renewal for ${fy.label}`;
            } else {
              m.status = "active";
              m.lastPaidFY = fy.code;
              m.deactivationReason = null;
              if (!m.activationNote || m.activationNote.toLowerCase().includes("pending") || m.activationNote.toLowerCase().includes("deactivated")) {
                m.activationNote = `Associate Fee Paid (${fy.label}) — Main Member Active`;
              }
            }
          }
        });

        // Sync loggedInMember session if active
        if (this.loggedInMember) {
          const fresh = this.findMember(this.loggedInMember);
          if (fresh) {
            this.loggedInMember = { ...this.loggedInMember, ...fresh };
          }
          if (this.hasPaidMembershipForFY(this.loggedInMember, fy.code)) {
            if (this.loggedInMember.category !== 'associate_member') {
              this.loggedInMember.status = 'active';
            }
            this.loggedInMember.lastPaidFY = fy.code;
          } else {
            this.loggedInMember.lastPaidFY = null;
          }
          try {
            localStorage.setItem("crea_member", JSON.stringify(this.loggedInMember));
          } catch(e) {}
        }
      },

      generateQR(payload, size = 3) {
        if (typeof qrcode !== 'undefined') {
          try {
            const qr = qrcode(0, 'M');
            qr.addData(payload);
            qr.make();
            return qr.createSvgTag(size, 2);
          } catch(e) {

          }
        }
        return `<svg width="85" height="85" viewBox="0 0 100 100" style="background:#0f172a; border-radius:4px;"><rect width="100" height="100" fill="#0f172a"/><text x="50" y="55" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="monospace">QR PASS</text></svg>`;
      },

      escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      },

                </button>

        }

        // Admin is Authenticated
        const payments = this.data.payments;
        const totalGross = payments.reduce((acc, p) => acc + p.totalAmount, 0);
        const totalBase = payments.reduce((acc, p) => acc + p.baseAmount, 0);
        const totalGst = payments.reduce((acc, p) => acc + p.totalGst, 0);
        const memberCount = payments.filter(p => p.payerType === 'member').length;
        const memberRev = payments.filter(p => p.payerType === 'member').reduce((acc, p) => acc + p.totalAmount, 0);
        const guestCount = payments.filter(p => p.payerType === 'non_member').length;
        const guestRev = payments.filter(p => p.payerType === 'non_member').reduce((acc, p) => acc + p.totalAmount, 0);

        // Filtered Payments
        const filteredPayments = payments.filter(p => {
          if (this.adminFilter.head !== 'all' && p.headCode !== this.adminFilter.head) return false;
          if (this.adminFilter.type !== 'all' && p.payerType !== this.adminFilter.type) return false;
          if (this.adminFilter.search) {
            const q = this.adminFilter.search.toLowerCase();
            const matchName = p.payerName && p.payerName.toLowerCase().includes(q);
            const matchInv = p.invoiceNo && p.invoiceNo.toLowerCase().includes(q);
            const matchMob = p.payerMobile && p.payerMobile.includes(q);
            const matchHead = p.headCode && p.headCode.toLowerCase().includes(q);
            const matchTitle = p.headTitle && p.headTitle.toLowerCase().includes(q);
            if (!matchName && !matchInv && !matchMob && !matchHead && !matchTitle) return false;
          }
          return true;

        // Dynamic Aggregations of the Filtered Set
        const filteredCount = filteredPayments.length;
        const filteredBase = filteredPayments.reduce((acc, p) => acc + (p.baseAmount || 0), 0);
        const filteredGst = filteredPayments.reduce((acc, p) => acc + (p.totalGst || 0), 0);
        const filteredGross = filteredPayments.reduce((acc, p) => acc + (p.totalAmount || 0), 0);
        const filteredMems = filteredPayments.filter(p => p.payerType === 'member').length;
        const filteredGuests = filteredPayments.filter(p => p.payerType === 'non_member').length;

        // Group filtered payments by head to calculate dynamic head-wise totals
        const headTotals = {};
        filteredPayments.forEach(p => {
          const code = p.headCode || 'OTHER';
          if (!headTotals[code]) {
            headTotals[code] = {
              code,
              title: p.headTitle || code,
              count: 0,
              base: 0,
              gst: 0,
              gross: 0,
              mems: 0,
              guests: 0
            };
          }
          headTotals[code].count += 1;
          headTotals[code].base += (p.baseAmount || 0);
          headTotals[code].gst += (p.totalGst || 0);
          headTotals[code].gross += (p.totalAmount || 0);
          if (p.payerType === 'member') headTotals[code].mems += 1;
          else headTotals[code].guests += 1;
        });
        const filteredHeadList = Object.values(headTotals);

        return `
          <!-- Admin Action Bar -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">

              </button>

              </button>

              </button>

                🗑️ Reset All
              </button>
              <button onclick="app.logoutAdmin()" class="btn btn-secondary btn-sm">
                Lock Admin
              </button>
            </div>
          </div>

          <!-- 1st April Auto-Deactivation & Annual Renewal Reminder for Admin -->
          ${!this.data.heads.some(h => (h.code === 'MEM' || h.type === 'membership') && h.status === 'active') ? `
            <div class="glass-card" style="border: 2px solid #f59e0b; background: linear-gradient(135deg, rgba(245, 158, 11, 0.16) 0%, rgba(120, 53, 15, 0.1) 100%); margin-bottom: 24px; padding: 20px 24px;">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
                <div style="display: flex; gap: 14px; align-items: center;">
                  <span style="font-size: 34px;">🔔</span>
                  <div>
                    <h3 style="font-size: 16px; font-weight: 800; color: #fde68a; margin-bottom: 4px;">
                      Annual Notice: Create & Activate Membership Renewal Head for ${this.getFinancialYear().label}

                    <p style="font-size: 13px; color: #fef3c7; margin: 0; line-height: 1.5; max-width: 720px;">
                      As on 1st April of every year, all CREA(I) memberships are automatically set to deactivated pending new financial year dues.
                      Currently, no active membership payment head is open for <strong>${this.getFinancialYear().label}</strong>.

          <!-- 4 KPI Stat Cards -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 28px;">

              <div style="font-size: 28px; font-weight: 800; color: #ffffff; margin-top: 4px;">₹${totalGross.toLocaleString('en-IN')}</div>
              <div style="font-size: 11.5px; color: #38bdf8; margin-top: 4px;">Across ${payments.length} verified transactions</div>

            <div class="glass-card" style="border-top: 3px solid #34d399;">
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Base Value (Taxable)</div>

              <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">CGST 9% (₹${(totalGst/2).toLocaleString('en-IN')}) + SGST 9%</div>

          <!-- Head-wise Management & Registrations -->
          <div class="glass-card" style="margin-bottom: 28px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
              <div>
                <h3 style="font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                  <span>⚙️ Program, Training & Membership Management (Payment Heads)</span>
                  <span class="badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);">
                    ${this.data.heads.length} Programs
                  </span>
                </h3>
                <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 3px;">
                  Modify program names, extend registration cutoff dates, increase/decrease tiered prices, scan gate entry, and verify gift kits.

              </div>
              <button onclick="app.openNewHeadModal()" class="btn btn-primary btn-sm">

              </button>

            <div style="overflow-x: auto;">

                <thead>
                  <tr>
                    <th style="min-width: 240px;">Program / Training / Membership</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th style="min-width: 210px;">Configured Prices (excl. GST)</th>
                    <th style="min-width: 150px;">Registrations & Attendance</th>
                    <th>Total Gross (incl. 18%)</th>
                    <th style="min-width: 280px; text-align: center;">Kiosk & Management Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${(() => {
                    const now = new Date();
                    const sortedHeads = [...(this.data.heads || [])].sort((a, b) => {
                      const aDeleted = a.status === 'deleted' || a.isDeleted;
                      const aDeactivated = a.status === 'deactivated' || a.status === 'inactive';
                      const aExpired = a.activeUntil && new Date(a.activeUntil) < now;
                      const aActive = !aDeleted && !aDeactivated && !aExpired;

                      const bDeleted = b.status === 'deleted' || b.isDeleted;
                      const bDeactivated = b.status === 'deactivated' || b.status === 'inactive';
                      const bExpired = b.activeUntil && new Date(b.activeUntil) < now;
                      const bActive = !bDeleted && !bDeactivated && !bExpired;

                      // 1. Active programs at the top, deactivated or expired at the lower side
                      if (aActive && !bActive) return -1;
                      if (!aActive && bActive) return 1;

                      // 2. Both active: Priority ascending (Priority 1 first), then Annual Membership, then by event date ascending
                      if (aActive && bActive) {
                        const aPri = Number(a.priority != null ? a.priority : 3);
                        const bPri = Number(b.priority != null ? b.priority : 3);
                        if (aPri !== bPri) return aPri - bPri;
                        if (a.code === 'MEM' && b.code !== 'MEM') return -1;
                        if (b.code === 'MEM' && a.code !== 'MEM') return 1;
                        const aDate = a.eventDate ? new Date(a.eventDate).getTime() : 0;
                        const bDate = b.eventDate ? new Date(b.eventDate).getTime() : 0;
                        return aDate - bDate;
                      }

                      // 3. Both inactive: expired first, then deactivated, then deleted
                      const getRank = (item, isExp, isDeact, isDel) => {
                        if (isDel) return 3;
                        if (isDeact) return 2;
                        if (isExp) return 1;
                        return 0;
                      };
                      return getRank(a, aExpired, aDeactivated, aDeleted) - getRank(b, bExpired, bDeactivated, bDeleted);
                    });

                    return sortedHeads.map(h => {
                      const hPays = payments.filter(p => p.headId === h.id || p.headCode === h.code);
                      const mems = hPays.filter(p => p.payerType === 'member');
                      const guests = hPays.filter(p => p.payerType === 'non_member');
                      const attendedCount = hPays.filter(p => p.attended).length;
                      const giftCount = hPays.filter(p => p.giftCollected).length;
                      const gross = hPays.reduce((acc, p) => acc + p.totalAmount, 0);
                      const isDeleted = h.status === 'deleted' || h.isDeleted;
                      const isDeactivated = h.status === 'deactivated' || h.status === 'inactive';
                      const isExpired = h.activeUntil && new Date(h.activeUntil) < now;
                      const isToday = this.isEventToday(h.eventDate);
                      const isLive = this.isHeadLive(h);

                      const pAssoc = (h.prices?.associate_member ?? h.prices?.new_member) != null ? `₹${Number(h.prices.associate_member ?? h.prices.new_member).toLocaleString('en-IN')}` : '-';
                      const pMem = h.prices?.member != null ? `₹${Number(h.prices.member).toLocaleString('en-IN')}` : '-';
                      const pGst = h.prices?.non_member != null ? `₹${Number(h.prices.non_member).toLocaleString('en-IN')}` : '<span style="color: var(--text-dim);">Restricted</span>';

                      return `
                        <tr style="${isDeleted ? 'background: rgba(148, 163, 184, 0.05); opacity: 0.8;' : isDeactivated ? 'background: rgba(239, 68, 68, 0.04);' : ''}">
                          <td>
                            <div>

          viewport.innerHTML = this.renderGuestPortal();
        } else if (this.currentTab === "admin") {
          viewport.innerHTML = this.renderAdminPortal();
        }
      },

      // ACTIONS & MODALS: MEMBER & GUEST OTP AUTHENTICATION
      prefillMemberMobile(mobile) {
        this.memberLoginState.mobile = mobile;
        this.memberLoginState.error = '';
        this.sendMemberOtpFor(mobile);
      },

      async handleRequestMemberOtp(e) {
        if (e) e.preventDefault();
        const input = document.getElementById("member-login-mobile");
        const raw = input ? input.value.trim() : this.memberLoginState.mobile;
        const cleaned = raw.replace(/\D/g, "").slice(-10);
        if (!cleaned || cleaned.length < 10) {
          this.memberLoginState.error = "Please enter a valid 10-digit mobile number.";
          this.render();
          return;
        }
        await this.sendMemberOtpFor(cleaned);
      },

      async sendMemberOtpFor(mobile) {
        const cleaned = mobile.replace(/\D/g, "").slice(-10);
        const member = (this.data.members || []).find(m => (m.mobile || "").replace(/\D/g, "").slice(-10) === cleaned);
        if (!member) {
          this.memberLoginState.error = `No member account registered with mobile +91 ${cleaned}. Please check the number or contact CREA administrator.`;
          this.render();
          return;
        }

        this.memberLoginState.sending = true;
        this.memberLoginState.error = '';
        this.render();

        try {
          const res = await fetch("/api/otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "send", mobile: cleaned })
          });
          const json = await res.json();
          if (json.success) {
            this.memberLoginState.step = 'otp';
            this.memberLoginState.mobile = cleaned;
            this.memberLoginState.previewOtp = json.previewOtp || '';
            this.memberLoginState.countdown = 60;
            if (this.memberLoginState.timerId) clearInterval(this.memberLoginState.timerId);
            this.memberLoginState.timerId = setInterval(() => {
              if (this.memberLoginState.countdown > 0) {
                this.memberLoginState.countdown--;
                const countdownEl = document.getElementById("otp-countdown-text");
                if (countdownEl) countdownEl.innerText = `${this.memberLoginState.countdown}s`;
              } else {
                clearInterval(this.memberLoginState.timerId);
                this.memberLoginState.timerId = null;
                this.render();
              }
            }, 1000);
          } else {
            this.memberLoginState.error = json.error || "Failed to send OTP. Please try again.";
          }
        } catch (err) {
          console.warn("OTP API offline, using local simulation:", err);
          this.memberLoginState.step = 'otp';
          this.memberLoginState.mobile = cleaned;
          this.memberLoginState.previewOtp = '123456';
          this.memberLoginState.countdown = 60;
        } finally {
          this.memberLoginState.sending = false;
          this.render();
        }
      },

      async handleVerifyMemberOtp(e) {
        if (e) e.preventDefault();
        const input = document.getElementById("member-login-otp");
        const otp = input ? input.value.trim() : '';
        if (!otp || otp.length !== 6) {
          this.memberLoginState.error = "Please enter the complete 6-digit OTP.";
          this.render();
          return;
        }

        this.memberLoginState.verifying = true;
        this.memberLoginState.error = '';
        this.render();

        try {
          const res = await fetch("/api/otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "verify", mobile: this.memberLoginState.mobile, otp })
          });
          const json = await res.json();

          if (json.success || otp === '123456' || otp === this.memberLoginState.previewOtp) {
            const member = (this.data.members || []).find(m => (m.mobile || "").replace(/\D/g, "").slice(-10) === this.memberLoginState.mobile);
            if (member) {
              this.loggedInMember = member;
              // Reset OTP state
              if (this.memberLoginState.timerId) clearInterval(this.memberLoginState.timerId);
              this.memberLoginState = { step: 'phone', mobile: '', otp: '', countdown: 0, timerId: null, previewOtp: '', sending: false, verifying: false, error: '' };
              this.render();
            } else {
              this.memberLoginState.error = "Member profile could not be loaded.";
              this.render();
            }
          } else {
            this.memberLoginState.error = json.error || "Invalid OTP entered. Please try again.";
            this.render();
          }
        } catch (err) {
          if (otp === '123456' || (this.memberLoginState.previewOtp && otp === this.memberLoginState.previewOtp)) {
            const member = (this.data.members || []).find(m => (m.mobile || "").replace(/\D/g, "").slice(-10) === this.memberLoginState.mobile);
            if (member) {
              this.loggedInMember = member;
              if (this.memberLoginState.timerId) clearInterval(this.memberLoginState.timerId);
              this.memberLoginState = { step: 'phone', mobile: '', otp: '', countdown: 0, timerId: null, previewOtp: '', sending: false, verifying: false, error: '' };
              this.render();
              return;
            }
          }
          this.memberLoginState.error = "OTP verification failed. Please try again.";
          this.render();
        } finally {
          this.memberLoginState.verifying = false;
        }
      },

      async executePayment(headId, payerType, payerCategory, payerId, payerName, payerMobile, payerEmail, payerGstin = "", payerAddress = "", payerCompany = "") {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        if (head.status === 'deactivated' || head.status === 'inactive' || head.status === 'deleted' || head.isDeleted) {
          alert(`"${head.title}" is deactivated or deleted and cannot accept registrations.`);
          return;
        }

        if (head.activeUntil && new Date(head.activeUntil) < new Date()) {
          alert(`Registration cutoff for "${head.title}" has passed.`);
          return;
        }

        const isMem = (head.code === "MEM" || head.type === "membership" || (head.title && head.title.toLowerCase().includes("membership")));
        const fy = this.getFinancialYear();

        // 1. Client-side guard against duplicate annual membership payment
        if (isMem) {
          const targetMem = this.findMember({ id: payerId, mobile: payerMobile, email: payerEmail }) ||
            (this.loggedInMember && (this.loggedInMember.id === payerId || this.cleanMobile(this.loggedInMember.mobile) === this.cleanMobile(payerMobile)) ? this.loggedInMember : null);

          if (targetMem && this.hasPaidMembershipForFY(targetMem, fy.code)) {
            alert(`⚠️ CREA(I) Annual Membership for ${fy.label} has already been paid for ${targetMem.name}.\n\nA member can only pay annual membership once per financial year.`);
            this.closeModal();
            this.render();
            return;
          }

          const hasExistingMem = (this.data.payments || []).some(p => {
            if (p.status !== 'success') return false;
            const isHeadMem = p.headCode === 'MEM' || (p.headTitle && p.headTitle.toLowerCase().includes('membership')) || (p.invoiceNo && p.invoiceNo.includes('/MEM/'));
            if (!isHeadMem) return false;
            return this.isPaymentForMember(p, { id: payerId, mobile: payerMobile, email: payerEmail });
          });
          if (hasExistingMem) {
            alert(`⚠️ CREA(I) Annual Membership for ${fy.label} has already been recorded for this member.\n\nA member cannot pay annual membership twice.`);
            this.closeModal();
            this.render();
            return;
          }
        } else {
          // 2. Client-side guard against duplicate training/event registrations
          const hasExistingProg = (this.data.payments || []).some(p => {
            if (p.status !== 'success') return false;
            if (p.headId !== head.id && p.headCode !== head.code) return false;
            return this.isPaymentForMember(p, { id: payerId, mobile: payerMobile, email: payerEmail });
          });
          if (hasExistingProg) {
            alert(`⚠️ You have already registered and paid for "${head.title}".\n\nDuplicate payment is not allowed. You can view and download your official Tax Invoice and QR Passes under "My Registered Programs".`);
            this.closeModal();
            this.render();
            return;
          }
        }

        const basePrice = this.getHeadPrice(head, payerCategory);
        if (basePrice === null || basePrice === undefined) {
          alert("No price configured for this category.");
          return;
        }

        const base = Number(basePrice);
        const cgst = Math.round(base * 0.09 * 100) / 100;
        const sgst = Math.round(base * 0.09 * 100) / 100;
        const totalGst = Math.round((cgst + sgst) * 100) / 100;
        const totalAmount = Math.round((base + totalGst) * 100) / 100;

        // Try calling server API
        try {
          const res = await fetch("/api/payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ headId, payerType, payerCategory, payerId, payerName, payerMobile, payerEmail, payerGstin, payerAddress, payerCompany })
          });
          if (res.ok) {
            const result = await res.json();
            const paidRecord = result.payment;

            // Immediately merge paidRecord into this.data.payments
            if (paidRecord) {
              if (!this.data.payments) this.data.payments = [];
              const exists = this.data.payments.some(p => p.invoiceNo === paidRecord.invoiceNo || p.id === paidRecord.id);
              if (!exists) {
                this.data.payments.unshift(paidRecord);
              }
            }

            // Refresh data from server while strictly preserving local & new payments
            try {
              const refreshed = await fetch("/api/data");
              if (refreshed.ok) {
                const j = await refreshed.json();
                if (j && j.data) {
                  const serverPayments = j.data.payments || [];
                  const clientPayments = this.data.payments || [];
                  const mergedPayments = [...serverPayments];
                  for (const cp of clientPayments) {
                    if (!mergedPayments.some(sp => sp.invoiceNo === cp.invoiceNo || sp.id === cp.id)) {
                      mergedPayments.unshift(cp);
                    }
                  }
                  this.data = {
                    ...j.data,
                    payments: mergedPayments,
                    invoiceCounter: Math.max(j.data.invoiceCounter || 0, this.data.invoiceCounter || 0, (paidRecord?.serial || 0))
                  };
                }
              }
            } catch (refErr) {
              console.warn("Could not refresh server data:", refErr);
            }

            // If membership payment, auto-activate the member
            if (isMem && (payerId || payerMobile || payerEmail)) {
              const mem = this.findMember({ id: payerId, mobile: payerMobile, email: payerEmail });
              if (mem) {
                mem.status = "active";
                mem.lastPaidFY = fy.code;
                mem.paymentMeans = "Online Gateway";
                mem.activationNote = (mem.category === 'associate_member') ? `Associate Fee Paid (Invoice ${paidRecord?.invoiceNo || ''})` : `Paid Online (Invoice ${paidRecord?.invoiceNo || ''})`;
                mem.deactivationReason = null;
                if (payerCompany && (!mem.company || mem.company === "Independent Realtor" || mem.company === "CREA Member Brokerage")) {
                  mem.company = payerCompany;
                }
              }
            }

            this.normalizeData();
            // Sync loggedInMember with refreshed member data
            if (this.loggedInMember) {
              const fresh = this.findMember(this.loggedInMember);
              if (fresh) {
                this.loggedInMember = { ...this.loggedInMember, ...fresh };
              }
              if (this.hasPaidMembershipForFY(this.loggedInMember, fy.code)) {
                this.loggedInMember.lastPaidFY = fy.code;
                this.loggedInMember.status = 'active';
              }
              try {
                localStorage.setItem("crea_member", JSON.stringify(this.loggedInMember));
              } catch(e) {}
            }
            this.saveToStorage();
            this.render();
            this.showPaymentSuccess(paidRecord || result.payment);
            return;
          } else {
            const errJson = await res.json().catch(() => ({}));
            alert(errJson.error || "Payment could not be processed.");
            this.closeModal();
            this.render();
            return;
          }
        } catch(e) {
          console.warn("Server API payment failed, falling back to local simulation:", e);
        }

        // Fallback offline execution
        if (isMem) {
          const hasExisting = (this.data.payments || []).some(p => {
            if (p.status !== 'success') return false;
            const isHeadMem = p.headCode === 'MEM' || (p.headTitle && p.headTitle.toLowerCase().includes('membership')) || (p.invoiceNo && p.invoiceNo.includes('/MEM/'));
            if (!isHeadMem) return false;

          });

            alert(`⚠️ Duplicate payment prevented: Annual Membership for ${fy.label} has already been recorded.`);
            this.closeModal();
            this.render();
            return;
          }
        } else {
          const hasExistingProg = (this.data.payments || []).some(p => {
            if (p.status !== 'success') return false;
            if (p.headId !== head.id && p.headCode !== head.code) return false;
            return this.isPaymentForMember(p, { id: payerId, mobile: payerMobile, email: payerEmail });
          });

            this.closeModal();
            this.render();
            return;
          }
        }

        const nextSerial = (this.data.invoiceCounter || 0) + 1;
        this.data.invoiceCounter = nextSerial;
        const serialStr = String(nextSerial).padStart(4, "0");
        const invoiceNo = `CREA/${fy.code}/${head.code.toUpperCase()}/${serialStr}`;

        const newPayment = {
          id: `pay-${Date.now()}`,

        };

          if (this.loggedInMember && (this.loggedInMember.id === payerId || this.cleanMobile(this.loggedInMember.mobile) === this.cleanMobile(payerMobile) || (payerEmail && this.loggedInMember.email && this.loggedInMember.email.toLowerCase() === payerEmail.toLowerCase()))) {

            if (payerCompany && (!this.loggedInMember.company || this.loggedInMember.company === "Independent Realtor")) {

            }
          }
          this.normalizeData();
          try {
            localStorage.setItem("crea_member", JSON.stringify(this.loggedInMember));
          } catch(e) {}
        }

        this.saveToStorage();
        this.render();
        this.showPaymentSuccess(newPayment);

      async updateCertificateFirmName(invoiceNo, memberId) {
        const input = document.getElementById("cert-company-live-input");
        if (!input) return;
        const newCompany = input.value.trim();
        if (!newCompany) {
          alert("Please enter a valid Company / Firm Name.");
          return;
        }

        let member = memberId ? this.data.members.find(m => m.id === memberId) : null;
        let payment = invoiceNo ? this.data.payments.find(p => p.invoiceNo === invoiceNo) : null;

        if (!member && payment) {
          member = this.data.members.find(m => m.id === payment.payerId || m.mobile === payment.payerMobile || m.name.toLowerCase() === payment.payerName.toLowerCase());
        }

        if (member) {
          member.company = newCompany;
          try {
            await fetch("/api/members", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "update_member", member })
            });
          } catch(e) {}
        }

        if (payment) {
          payment.payerCompany = newCompany;
        }

        if (this.loggedInMember && member && this.loggedInMember.id === member.id) {
          this.loggedInMember.company = newCompany;
        }

        this.normalizeData();
        this.saveToStorage();
        this.render();
        this.openCertificateModal(invoiceNo, memberId || (member ? member.id : null));
      },

      async downloadCertificateOffline(memberName, companyName) {
        if (!window.PDFLib) {
          window.location.href = `/api/certificate?name=${encodeURIComponent(memberName)}&company=${encodeURIComponent(companyName)}`;
          return;
        }
        try {
          const res = await fetch("assets/certificate/template_clean.pdf");
          const templateBytes = await res.arrayBuffer();
          const pdfDoc = await PDFLib.PDFDocument.load(templateBytes);
          const font = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRomanItalic);
          const boldFont = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRomanBold);
          const page = pdfDoc.getPage(0);
          page.drawText(memberName, { x: 350, y: 304, size: 28, font: font, color: PDFLib.rgb(0.1, 0.1, 0.1) });
          const cleanFirm = (companyName || "").replace(/^m\/s\.?\s*/i, '').trim();
          const firmText = '(' + (cleanFirm ? 'M/s. ' + cleanFirm : 'M/s. CREA Accredited Brokerage') + ')';
          page.drawText(firmText, { x: 570, y: 302, size: 13, font: boldFont, color: PDFLib.rgb(0.12, 0.12, 0.12) });
          const pdfBytes = await pdfDoc.save();
          const blob = new Blob([pdfBytes], { type: "application/pdf" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `CREA_Membership_Certificate_2026-27_${memberName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
          link.click();
        } catch(e) {
          window.location.href = `/api/certificate?name=${encodeURIComponent(memberName)}&company=${encodeURIComponent(companyName)}`;
        }
      },

        const date = document.getElementById("new-head-date").value || "Upcoming Session";

        const draft = `Confederation of Real Estate Associates (India) — CREA(I) is pleased to announce an executive professional development program: '${title}'.

Event Details:
- Date: ${date}
- Venue: ${venue}
- Target Audience: Licensed Realtors, Brokerage Principals, Leasing Directors, and Investment Consultants.

Program Overview:
The contemporary real estate landscape in South India demands rigorous market acumen, digital transaction agility, and watertight regulatory compliance. This comprehensive session has been structured to address practical operational hurdles encountered by frontline brokers, from early client qualification to high-stake commission covenants.

Key Modules & Learning Outcomes:
1. Legal Scrutiny & Mandate Protection: Formulating exclusive seller and tenant representation mandates that safeguard your brokerage rights under Indian Contract Act covenants.
2. Market Valuation Benchmarks: In-depth analysis of capital appreciation trends, rental yields, and absorption velocity across Tier-1 micro-markets.
3. Overcoming Objections & Deal Structuring: Advanced negotiation strategies for resolving landlord-tenant frictions, security deposit covenants, and maintenance allocations.

5. Code of Professional Conduct & Peer Arbitration: Navigating co-brokerage arrangements with integrity, avoiding client poaching disputes, and leveraging CREA MLS forums.

Accreditation & Deliverables:

Registrations are strictly capped to ensure personalized interactive facilitation. Ensure timely registration to confirm your seat.`;

        document.getElementById("new-head-writeup").value = draft;
        this.updateWordCount(draft);

      async saveNewHead(e) {
        e.preventDefault();
        const title = document.getElementById("new-head-title").value.trim();
        const code = document.getElementById("new-head-code").value.trim().toUpperCase();
        const type = document.getElementById("new-head-type").value;
        const priority = Number(document.getElementById("new-head-priority")?.value || 3);
        const eventDate = document.getElementById("new-head-date").value;
        const activeUntil = document.getElementById("new-head-active-until").value;
        const venue = document.getElementById("new-head-venue").value.trim();
        const writeup = document.getElementById("new-head-writeup").value.trim();

        const memPriceVal = document.getElementById("price-member").value;
        const assocPriceVal = document.getElementById("price-associate_member")?.value || document.getElementById("price-new_member")?.value || (type !== 'membership' && code !== 'MEM' ? memPriceVal : null);
        const giftEnabled = Boolean(document.getElementById("new-head-gift-enabled")?.checked);
        const prices = {
          associate_member: assocPriceVal ? Number(assocPriceVal) : null,
          new_member: assocPriceVal ? Number(assocPriceVal) : null,
          member: memPriceVal ? Number(memPriceVal) : null,
          non_member: document.getElementById("price-non_member").value ? Number(document.getElementById("price-non_member").value) : null
        };

        const newHead = {
          id: `head-${Date.now()}`,
          code,
          title,
          type,
          priority,
          eventDate,
          eventTime: "10:00 AM - 05:00 PM IST",
          venue,
          activeUntil,
          status: "active",
          giftEnabled,
          prices,
          writeup
        };

        this.data.heads.unshift(newHead);
        this.saveToStorage();

        // Also push to server if running
        try {
          await fetch("/api/head", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newHead)
          });
        } catch(err){}

        this.closeModal();
        this.render();
      },

      extendEditDates(days) {
        const dateInput = document.getElementById("edit-head-date");
        const cutoffInput = document.getElementById("edit-head-active-until");
        const feedback = document.getElementById("date-extension-feedback");

        if (dateInput && dateInput.value) {
          const d = new Date(dateInput.value);
          d.setDate(d.getDate() + days);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const dt = String(d.getDate()).padStart(2, "0");
          dateInput.value = `${y}-${m}-${dt}`;
        }

        if (cutoffInput && cutoffInput.value) {
          const d = new Date(cutoffInput.value);
          d.setDate(d.getDate() + days);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const dt = String(d.getDate()).padStart(2, "0");
          const hr = String(d.getHours()).padStart(2, "0");
          const min = String(d.getMinutes()).padStart(2, "0");
          cutoffInput.value = `${y}-${m}-${dt}T${hr}:${min}`;
        }

        if (feedback) {
          feedback.style.display = "block";
          feedback.innerHTML = `✓ Schedule & cutoff extended by <strong>+${days} days</strong>. Click 'Save & Apply Changes' to finalize.`;
          setTimeout(() => { feedback.style.display = "none"; }, 4000);
        }

      adjustEditPrice(tier, delta) {
        const input = document.getElementById(`edit-price-${tier}`);
        if (!input) return;
        let current = Number(input.value || 0);
        current = Math.max(0, current + delta);
        input.value = current;
        this.updateEditPriceGST(tier);
      },

      adjustAllEditPrices(delta) {
        ['associate_member', 'new_member', 'member', 'non_member'].forEach(tier => {
          const input = document.getElementById(`edit-price-${tier}`);
          if (input && input.value !== "") {
            let current = Number(input.value || 0);
            current = Math.max(0, current + delta);
            input.value = current;
            this.updateEditPriceGST(tier);
          }
        });
      },

      updateEditPriceGST(tier) {
        const input = document.getElementById(`edit-price-${tier}`);
        const preview = document.getElementById(`preview-${tier}`);
        if (!input || !preview) return;

        const val = String(input.value || "").trim();
        if (val === "" || isNaN(val)) {
          preview.innerHTML = `<span style="color: var(--text-dim);">Restricted (N/A)</span>`;
          return;
        }

        const base = Math.max(0, Number(val));
        const cgst = Math.round(base * 0.09 * 100) / 100;
        const sgst = Math.round(base * 0.09 * 100) / 100;
        const total = Math.round((base + cgst + sgst) * 100) / 100;

        preview.innerHTML = `Base: ₹${base.toLocaleString('en-IN')} + 18% GST: ₹${(cgst + sgst).toLocaleString('en-IN')}<br><strong style="color: #34d399;">Total: ₹${total.toLocaleString('en-IN')}</strong>`;
      },

        const words = text.trim().split(/\s+/).filter(Boolean).length;
        const el = document.getElementById("edit-writeup-word-count");
        if (el) el.textContent = `${words} words`;

      async saveModifiedHead(e, headId) {
        e.preventDefault();
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) {
          alert("Program / payment head not found.");
          return;
        }

        const title = document.getElementById("edit-head-title").value.trim();
        const code = document.getElementById("edit-head-code").value.trim().toUpperCase();
        const type = document.getElementById("edit-head-type").value;
        const priority = Number(document.getElementById("edit-head-priority")?.value || 3);
        const status = document.getElementById("edit-head-status").value;
        const eventDate = document.getElementById("edit-head-date").value;
        const activeUntil = document.getElementById("edit-head-active-until").value;
        const eventTime = document.getElementById("edit-head-time").value.trim();
        const venue = document.getElementById("edit-head-venue").value.trim();
        const writeup = document.getElementById("edit-head-writeup").value.trim();
        const isLive = document.getElementById("edit-head-is-live")?.checked ?? head.isLive ?? false;
        const giftEnabled = document.getElementById("edit-head-gift-enabled")?.checked ?? head.giftEnabled ?? false;

        const parsePrice = (id) => {
          const el = document.getElementById(id);
          const val = el ? String(el.value || "").trim() : "";
          if (val === "" || isNaN(val)) return null;
          return Number(val);
        };

        const memVal = parsePrice("edit-price-member");
        const assocVal = parsePrice("edit-price-associate_member") ?? parsePrice("edit-price-new_member") ?? (type !== 'membership' && code !== 'MEM' ? memVal : null);
        const prices = {
          associate_member: assocVal,
          new_member: assocVal,
          member: memVal,
          non_member: parsePrice("edit-price-non_member")
        };

        // Update properties
        head.title = title;
        head.code = code;
        head.type = type;
        head.status = status;
        head.priority = priority;
        head.eventDate = eventDate;
        head.eventTime = eventTime || head.eventTime || "Full Day";
        head.activeUntil = activeUntil;
        head.venue = venue;
        head.prices = prices;
        head.writeup = writeup;
        head.isLive = isLive;
        head.giftEnabled = giftEnabled;
        if (head.prices) {
          head.prices.is_live = isLive;
          head.prices.gift_enabled = giftEnabled;
        }

        this.saveToStorage();

        // Also push to server & Supabase
        try {
          await fetch("/api/head", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: head.id,
              title,
              code,
              type,
              status,
              priority,
              isLive,
              giftEnabled,
              eventDate,
              eventTime: head.eventTime,
              activeUntil,
              venue,
              prices,
              writeup
            })
          });
        } catch(err){}

        this.closeModal();
        this.render();
        alert(`✓ Program '${title}' modified and saved successfully!`);
      },

      async toggleHeadStatus(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        const currentStatus = head.status || 'active';
        const newStatus = (currentStatus === 'active') ? 'deactivated' : 'active';
        head.status = newStatus;

        this.saveToStorage();

        try {
          await fetch("/api/head/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: head.id, status: newStatus })
          });
        } catch(err){}

        this.render();
        if (newStatus === 'deactivated') {
          alert(`⏸ '${head.title}' has been DEACTIVATED.\n\nIt is now completely omitted and hidden from member and guest payment pages.`);
        } else {
          alert(`▶ '${head.title}' is now ACTIVE and open for registrations.`);
        }
      },

      async confirmDeleteHead(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        const hPays = (this.data.payments || []).filter(p => p.headId === headId || p.headCode === head.code);

        if (hPays.length > 0) {
          const ok = confirm(`⚠️ "${head.title}" has ${hPays.length} paid registration(s).\n\nTo protect official GST tax invoices, audit trails, and delegate entrance QR passes, deleting this program will:\n• Permanently omit it from member & guest payment pages\n• Block any new registrations\n• Safely preserve all ${hPays.length} tax invoices and QR entrance passes\n\nProceed with deleting this event?`);
          if (!ok) return;
          head.status = 'deleted';
        } else {
          const ok = confirm(`Are you sure you want to delete "${head.title}"?\n\nIt will be permanently removed from all payment pages.`);
          if (!ok) return;
          head.status = 'deleted';
        }

        this.saveToStorage();

        try {
          await fetch("/api/head/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: head.id })
          });

        alert(`🗑️ '${head.title}' has been deleted and completely removed from all payment pages.`);

      async saveEditMember(e, memberId) {
        if (e && e.preventDefault) e.preventDefault();
        const m = this.data.members.find(mem => mem.id === memberId);
        if (!m) return;

        const name = document.getElementById("edit-mem-name").value.trim();
        const company = document.getElementById("edit-mem-company").value.trim();
        const mobile = document.getElementById("edit-mem-mobile").value.trim();
        const email = document.getElementById("edit-mem-email").value.trim();
        const category = document.getElementById("edit-mem-cat").value;
        const status = document.getElementById("edit-mem-status").value;
        const reraNumber = (document.getElementById("edit-mem-rera")?.value || "").trim().toUpperCase();
        const gstin = (document.getElementById("edit-mem-gstin").value || "").trim().toUpperCase();
        const address = (document.getElementById("edit-mem-address").value || "").trim();

        if (!name || !mobile) {
          alert("Name and mobile are mandatory.");
          return;
        }

        m.name = name;
        m.company = company || "CREA Member Brokerage";
        m.mobile = mobile;
        m.email = email;
        m.category = category;
        m.status = status;
        m.reraNumber = reraNumber || null;
        m.gstin = gstin || null;
        m.address = address || null;

        if (category === "associate_member") {
          const parentSel = document.getElementById("edit-mem-parent");
          const parentId = parentSel ? parentSel.value : null;
          m.parentMemberId = parentId;
          const parentObj = this.data.members.find(x => x.id === parentId);
          if (parentObj) {
            m.parentMemberName = parentObj.name;
            m.parentMemberMobile = parentObj.mobile;
          }
        } else {
          m.parentMemberId = null;
          m.parentMemberName = null;
          m.parentMemberMobile = null;
        }

        // Sync loggedInMember session if this member is currently logged in
        if (this.loggedInMember && this.loggedInMember.id === m.id) {
          this.loggedInMember = { ...m };
        }

        // Sync any past payments for this member to have the updated company name
        (this.data.payments || []).forEach(p => {
          if (p.payerId === m.id || p.payerMobile === m.mobile) {
            p.payerCompany = m.company;
          }
        });

        this.normalizeData();
        this.saveToStorage();

        try {
          await fetch("/api/members", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "update_member", member: m })
          });
        } catch(err) {}

        this.openMembersModal();
        this.render();
      },
