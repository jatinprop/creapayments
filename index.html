      stopScanner() {
        this._scannerRunning = false;
        if (this._scannerStream) {
          try {
            this._scannerStream.getTracks().forEach(track => track.stop());
          } catch(err) {}
          this._scannerStream = null;
        }
      },

      playBeep(type = 'success') {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'success') {
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'warning') {
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(330, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.25);
          } else {
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
          }
        } catch(e) {}
      },

      // DELEGATE ATTENDANCE & GIFT TRACKER (Roster)
      openDelegateTracker(headId, searchTerm = '') {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        let registrations = this.data.payments.filter(p => p.headId === headId || p.headCode === head.code || p.headTitle === head.title);

        const total = registrations.length;
        const attendedCount = registrations.filter(p => p.attended).length;
        const giftCount = registrations.filter(p => p.giftCollected).length;
        const attendedPct = total > 0 ? Math.round((attendedCount / total) * 100) : 0;
        const giftPct = total > 0 ? Math.round((giftCount / total) * 100) : 0;

        if (searchTerm) {
          const s = searchTerm.toLowerCase();
          registrations = registrations.filter(p =>
            p.payerName.toLowerCase().includes(s) ||
            p.payerMobile.includes(s) ||
            p.invoiceNo.toLowerCase().includes(s) ||
            (p.payerGstin && p.payerGstin.toLowerCase().includes(s))
          );
        }

        document.getElementById("modal-root").innerHTML = `
          <div class="modal-overlay" onclick="app.closeModal(event)">
            <div class="modal-box" onclick="event.stopPropagation()" style="max-width: 920px;">
              <div class="modal-header">
                <div>
                  <h3 style="font-size: 18px; font-weight: 700;">📊 Delegate Attendance & Gift Tracker</h3>
                  <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">${head.title} (${head.eventDate || 'Scheduled'})</p>
                </div>
                <button class="modal-close" onclick="app.closeModal()">&times;</button>
              </div>

              <!-- Top Stats Summary -->
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px;">
                <div style="background: #090f1d; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 16px;">
                  <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Total Registrations</div>
                  <div style="font-size: 24px; font-weight: 800; color: #fff; margin-top: 4px;">${total}</div>
                </div>
                <div style="background: #090f1d; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 12px 16px;">
                  <div style="font-size: 11px; color: #38bdf8; text-transform: uppercase;">Gate Check-In (${attendedPct}%)</div>
                  <div style="font-size: 24px; font-weight: 800; color: #38bdf8; margin-top: 4px;">${attendedCount} / ${total}</div>
                </div>
                <div style="background: #090f1d; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 10px; padding: 12px 16px;">
                  <div style="font-size: 11px; color: #c084fc; text-transform: uppercase;">Gifts Collected (${giftPct}%)</div>
                  <div style="font-size: 24px; font-weight: 800; color: #c084fc; margin-top: 4px;">${giftCount} / ${total}</div>
                </div>
              </div>

              <!-- Filter & Actions Bar -->
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px;">
                <input type="text" id="roster-search" class="form-input" placeholder="Search by name, mobile, invoice..." value="${searchTerm}" style="max-width: 320px; padding: 6px 12px; font-size: 12px;" oninput="app.openDelegateTracker('${headId}', this.value)">
                <div style="display: flex; gap: 8px;">
                  <button onclick="app.openScannerModal('${headId}', 'attendance')" class="btn btn-secondary btn-sm" style="color: #38bdf8; border-color: rgba(56, 189, 248, 0.4);">📷 Scan Entry</button>
                  <button onclick="app.openScannerModal('${headId}', 'gift')" class="btn btn-secondary btn-sm" style="color: #c084fc; border-color: rgba(168, 85, 247, 0.4);">🎁 Scan Gift</button>
                  <button onclick="app.exportDelegateCSV('${headId}')" class="btn btn-primary btn-sm" style="font-size: 11.5px;">📥 Export Roster CSV</button>
                </div>
              </div>

              <!-- Delegates Table -->
              <div style="max-height: 380px; overflow-y: auto;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Delegate & Category</th>
                      <th>Mobile & GSTIN</th>
                      <th>Invoice & Paid</th>
                      <th>Gate Attendance</th>
                      <th>Welcome Gift</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${registrations.length === 0 ? `
                      <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-dim); padding: 24px;">No registrations found matching criteria.</td>
                      </tr>
                    ` : registrations.map(p => `
                      <tr>
                        <td>
                          <strong>${p.payerName}</strong>
                          <div style="font-size: 11px; margin-top: 2px;">
                            <span class="badge badge-${p.payerCategory}">${p.payerCategory.replace('_', ' ')}</span>
                          </div>
                        </td>
                        <td>
                          <div>${p.payerMobile}</div>
                          ${p.payerGstin ? `<div style="font-size: 10.5px; color: #38bdf8; font-family: monospace;">${p.payerGstin}</div>` : ''}
                        </td>
                        <td>
                          <a href="#" onclick="event.preventDefault(); app.viewInvoice('${p.invoiceNo}')" style="color: #38bdf8; text-decoration: underline; font-size: 12px;">${p.invoiceNo}</a>
                          <div style="font-size: 11px; color: var(--text-muted);">₹${p.totalAmount.toLocaleString('en-IN')}</div>
                        </td>
                        <td>
                          ${p.attended ? `
                            <button onclick="app.toggleAttendance('${p.invoiceNo}', '${headId}')" class="btn btn-sm" style="background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; font-size: 11px; padding: 4px 8px;" title="Click to undo check-in">
                              ✓ Checked In (${new Date(p.attendedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })})
                            </button>
                          ` : `
                            <button onclick="app.toggleAttendance('${p.invoiceNo}', '${headId}')" class="btn btn-secondary btn-sm" style="font-size: 11px; padding: 4px 8px;">
                              + Mark Entry
                            </button>
                          `}
                        </td>
                        <td>
                          ${p.giftCollected ? `
                            <button onclick="app.toggleGift('${p.invoiceNo}', '${headId}')" class="btn btn-sm" style="background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #9333ea; font-size: 11px; padding: 4px 8px;" title="Click to undo gift handover">
                              🎁 Claimed (${new Date(p.giftCollectedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })})
                            </button>
                          ` : `
                            <button onclick="app.toggleGift('${p.invoiceNo}', '${headId}')" class="btn btn-secondary btn-sm" style="font-size: 11px; padding: 4px 8px;">
                              + Hand Over Gift
                            </button>
                          `}
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>

              <div style="margin-top: 18px; text-align: right;">
                <button onclick="app.closeModal(); app.render();" class="btn btn-secondary btn-sm">Close</button>
              </div>
            </div>
          </div>
        `;
      },

      toggleAttendance(invoiceNo, headId) {
        const payment = this.data.payments.find(p => p.invoiceNo === invoiceNo);
        if (!payment) return;
        payment.attended = !payment.attended;
        payment.attendedAt = payment.attended ? new Date().toISOString() : null;
        this.saveToStorage();
        this.openDelegateTracker(headId);
      },

      toggleGift(invoiceNo, headId) {
        const payment = this.data.payments.find(p => p.invoiceNo === invoiceNo);
        if (!payment) return;
        payment.giftCollected = !payment.giftCollected;
        payment.giftCollectedAt = payment.giftCollected ? new Date().toISOString() : null;
        this.saveToStorage();
        this.openDelegateTracker(headId);
      },

      exportDelegateCSV(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        const registrations = this.data.payments.filter(p => p.headId === headId || p.headCode === head.code || p.headTitle === head.title);

        const rows = [
          ["Invoice No", "Date Paid", "Attendee Name", "Mobile", "Email", "Category", "GSTIN", "Billing Address", "Paid INR", "Gate Attendance", "Attendance Timestamp", "Gift Collected", "Gift Timestamp"]
        ];

        registrations.forEach(p => {
          rows.push([
            p.invoiceNo,
            p.date,
            `"${p.payerName}"`,
            p.payerMobile,
            p.payerEmail,
            p.payerCategory,
            `"${p.payerGstin || ''}"`,
            `"${(p.payerAddress || '').replace(/"/g, '""')}"`,
            p.totalAmount,
            p.attended ? "YES" : "NO",
            p.attendedAt || "",
            p.giftCollected ? "YES" : "NO",
            p.giftCollectedAt || ""
          ]);
        });

        const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `CREA_Roster_${head.code}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      },

      // 1-CLICK YEARLY MEMBERSHIP RENEWAL (1st April Cycle)
      triggerYearlyRenewal() {
        if (!confirm("Activate 1-Click Yearly Membership Renewal? This will deactivate all members for the upcoming financial year until new membership dues are settled.")) return;

        const nextYear = new Date().getFullYear() + 1;
        const fy = `${String(nextYear).slice(-2)}${String(nextYear + 1).slice(-2)}`;

        // Deactivate all members for new FY
        this.data.members.forEach(m => {
          m.status = "deactivated";
          m.lastPaidFY = null;
          m.deactivationReason = `Pending Annual Renewal for FY ${nextYear}-${nextYear + 1}`;
        });

        // Add renewal head
        const renewalHead = {
          id: `head-mem-${Date.now()}`,
          code: "MEM",
          title: `Annual CREA(I) Membership Renewal ${nextYear}-${nextYear + 1}`,
          type: "membership",
          eventDate: `${nextYear}-04-01`,
          eventTime: "Full Year Access",
          venue: "All Regional Chapters",
          activeUntil: `${nextYear + 1}-03-31T23:59:59`,
          status: "active",
          prices: { associate_member: 5000, member: 10000, board_member: 8000, non_member: null },
          writeup: `Annual membership renewal for accredited real estate brokerages for ${nextYear}-${nextYear + 1}. Unlocks full integration with CREA Multi-Listing Exchange, legal escrow protection, and certified broker masterclasses.`
        };

        this.data.heads.unshift(renewalHead);
        this.normalizeData();
        this.saveToStorage();
        alert(`Yearly Membership Renewal Activated! Head '${renewalHead.title}' published and all members queued for FY ${nextYear}-${nextYear + 1} dues payment.`);
        this.render();
      },

      // EXPORT CSV (Full Ledger)
      exportCSV() {
        const rows = [
          ["Invoice Number", "Date", "Payer Name", "Mobile", "Email", "Payer Type", "Category", "Payer GSTIN", "Billing Address", "Program Head", "Head Code", "Base (INR)", "CGST 9% (INR)", "SGST 9% (INR)", "Total Paid (INR)", "Status", "Attended", "Attended At", "Gift Collected", "Gift Collected At", "Payment Method"]
        ];

        this.data.payments.forEach(p => {
          rows.push([
            p.invoiceNo,
            p.date,
            `"${p.payerName}"`,
            p.payerMobile,
            p.payerEmail,
            p.payerType,
            p.payerCategory,
            `"${p.payerGstin || ''}"`,
            `"${(p.payerAddress || '').replace(/"/g, '""')}"`,
            `"${p.headTitle}"`,
            p.headCode,
            p.baseAmount,
            p.cgst,
            p.sgst,
            p.totalAmount,
            p.status,
            p.attended ? "YES" : "NO",
            p.attendedAt || "",
            p.giftCollected ? "YES" : "NO",
            p.giftCollectedAt || "",
            `"${p.method || ''}"`
          ]);
        });

        const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `CREA_Payments_Ledger_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      },

      // SIMULATE 10 PAYMENTS
      simulatePayments() {
        const sampleGuests = [
          { name: "Vikram Singhania", mobile: "9811223344", email: "vikram@singhaniarealty.in", gstin: "29AABCU9603R1ZM", address: "102 Lavelle Road, Bangalore" },
          { name: "Neha Chhabra", mobile: "9822334455", email: "neha@chhabrahomes.com", gstin: "29AADCP9912K1Z8", address: "84 Residency Road, Bangalore" },
          { name: "Arun Alva", mobile: "9833445566", email: "arun@alvabrokerage.co", gstin: "", address: "304 Koramangala 4th Block, Bangalore" }
        ];

        const fy = this.getFinancialYear();

        for (let i = 0; i < 10; i++) {
          const isMember = Math.random() > 0.4;
          let payer, cat, payerType, payerId;

          if (isMember) {
            payer = this.data.members[Math.floor(Math.random() * this.data.members.length)];
            cat = payer.category;
            payerType = "member";
            payerId = payer.id;
          } else {
            payer = sampleGuests[Math.floor(Math.random() * sampleGuests.length)];
            cat = "non_member";
            payerType = "non_member";
            payerId = null;
          }

          const validHeads = this.data.heads.filter(h => h.status !== 'deactivated' && h.status !== 'inactive' && h.status !== 'deleted' && !h.isDeleted && h.prices && h.prices[cat] !== null && h.prices[cat] !== undefined);
          if (validHeads.length === 0) continue;
          const head = validHeads[Math.floor(Math.random() * validHeads.length)];

          const base = Number(head.prices[cat]);
          const cgst = Math.round(base * 0.09 * 100) / 100;
          const sgst = Math.round(base * 0.09 * 100) / 100;
          const totalGst = Math.round((cgst + sgst) * 100) / 100;
          const totalAmount = Math.round((base + totalGst) * 100) / 100;

          const nextSerial = (this.data.invoiceCounter || 0) + 1;
          this.data.invoiceCounter = nextSerial;
          const serialStr = String(nextSerial).padStart(4, "0");
          const invoiceNo = `CREA/${fy}/${head.code.toUpperCase()}/${serialStr}`;

          this.data.payments.unshift({
            id: `pay-${Date.now()}-${i}`,
            invoiceNo,
            serial: nextSerial,
            date: new Date(Date.now() - Math.floor(Math.random() * 86400000 * 25)).toISOString(),
            headId: head.id,
            headCode: head.code,
            headTitle: head.title,
            payerType,
            payerCategory: cat,
            payerId,
            payerName: payer.name,
            payerMobile: payer.mobile,
            payerEmail: payer.email,
            payerGstin: payer.gstin || "",
            payerAddress: payer.address || "",
            attended: Math.random() > 0.5,
            attendedAt: new Date().toISOString(),
            giftCollected: Math.random() > 0.6,
            giftCollectedAt: new Date().toISOString(),
            baseAmount: base,
            cgst,
            sgst,
            totalGst,
            totalAmount,
            status: "success",
            method: "Simulated Direct"
          });
        }

        this.normalizeData();
        this.saveToStorage();
        alert("Simulated 10 additional transactions successfully!");
        this.render();
      },

      // RESET ALL PAYMENTS
      resetAllPayments() {
        if (!confirm("Are you sure you want to clear all payments and reset invoice numbering back to 0001?")) return;
        this.data.payments = [];
        this.data.emailLogs = [];
        this.data.invoiceCounter = 0;
        this.normalizeData();
        this.saveToStorage();
        alert("All payments cleared. Invoice numbering reset to 0001.");
        this.render();
      }
    };

    // Initialize application on page load
    window.addEventListener("DOMContentLoaded", () => {
      app.init();
    });
  </script>
</body>
</html>
