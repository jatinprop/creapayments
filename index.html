      // GSTIN Auto-fetch & autofill handler
      _gstTimer: null,
      onGstInput(val, mode = 'add') {
        const clean = (val || '').replace(/[^a-zA-Z0-9]/g, '').trim().toUpperCase();
        const gstinInput = document.getElementById(`${mode}-mem-gstin`);
        if (gstinInput && gstinInput.value !== clean) {
          gstinInput.value = clean;
        }
        const statusEl = document.getElementById(`${mode}-mem-gstin-status`);
        if (this._gstTimer) clearTimeout(this._gstTimer);

        if (!clean) {
          if (statusEl) statusEl.innerHTML = '';
          return;
        }

        if (clean.length < 15) {
          if (statusEl) {
            statusEl.innerHTML = `<span style="color: var(--text-dim);">${clean.length}/15 chars</span>`;
          }
          return;
        }

        if (clean.length === 15) {
          if (statusEl) {
            statusEl.innerHTML = `<span style="color: #38bdf8;">🔄 Verifying GSTIN...</span>`;
          }
          this._gstTimer = setTimeout(() => {
            this.fetchAndFillGst(mode);
          }, 200);
        }
      },

      async fetchAndFillGst(mode = 'add') {
        const gstinInput = document.getElementById(`${mode}-mem-gstin`);
        const statusEl = document.getElementById(`${mode}-mem-gstin-status`);
        const companyInput = document.getElementById(`${mode}-mem-company`);
        const addressInput = document.getElementById(`${mode}-mem-address`);

        if (!gstinInput) return;
        const gstin = (gstinInput.value || '').replace(/[^a-zA-Z0-9]/g, '').trim().toUpperCase();
        gstinInput.value = gstin;

        if (!gstin || gstin.length !== 15) {
          if (statusEl) statusEl.innerHTML = '<span style="color: #f87171;">Enter 15-digit GSTIN</span>';
          return;
        }

        if (statusEl) {
          statusEl.innerHTML = '<span style="color: #38bdf8;">🔄 Fetching details...</span>';
        }

        try {
          const res = await fetch(`/api/gst?gstin=${encodeURIComponent(gstin)}`);
          const data = await res.json();

          if (!data || !data.success) {
            if (statusEl) {
              statusEl.innerHTML = `<span style="color: #f87171;" title="${data?.error || ''}">⚠️ ${data?.error || 'Lookup failed'}</span>`;
            }
            return;
          }

          // Auto-fill firm / trade name if available
          const fetchedCompany = data.company || data.tradeName || data.legalName;
          if (fetchedCompany && companyInput) {
            companyInput.value = fetchedCompany;
            companyInput.style.transition = 'all 0.3s ease';
            companyInput.style.borderColor = '#10b981';
            companyInput.style.boxShadow = '0 0 12px rgba(16, 185, 129, 0.45)';
            setTimeout(() => {
              companyInput.style.boxShadow = 'none';
            }, 2000);
          }

          // Auto-fill address
          if (data.address && addressInput) {
            addressInput.value = data.address;
            addressInput.style.transition = 'all 0.3s ease';
            addressInput.style.borderColor = '#10b981';
            addressInput.style.boxShadow = '0 0 12px rgba(16, 185, 129, 0.45)';
            setTimeout(() => {
              addressInput.style.boxShadow = 'none';
            }, 2000);
          }

          if (statusEl) {
            if (fetchedCompany) {
              statusEl.innerHTML = `<span style="color: #34d399; font-weight: 600;" title="${data.tradeName || data.legalName}">✓ Verified: ${data.state} (${data.source === 'razorpay_api' || data.source === 'razorpay_web' ? 'Live GST' : 'Directory'})</span>`;
            } else if (data.partial) {
              statusEl.innerHTML = `<span style="color: #fbbf24;">✓ ${data.state} (${data.entityType || 'Verified'})</span>`;
            } else {
              statusEl.innerHTML = `<span style="color: #34d399;">✓ Verified</span>`;
            }
          }
        } catch (err) {
          if (statusEl) {
            statusEl.innerHTML = `<span style="color: #f87171;">⚠️ Network error</span>`;
          }
        }
      },

      async submitManualActivation(memberId) {
        const mem = this.data.members.find(m => m.id === memberId);
        if (!mem) return;

        const paymentMeans = document.getElementById("manual-pay-means").value;
        const description = (document.getElementById("manual-pay-note").value || "").trim();
        const createInvoice = document.getElementById("manual-create-inv").checked;

        if (!description) {
          alert("Please enter a payment description or transaction reference.");
          return;
        }

        const currentFY = this.getFinancialYear();
        const memHead = this.data.heads.find(h => h.code === "MEM" || h.type === "membership") || this.data.heads[0];

        mem.status = "active";
        mem.lastPaidFY = currentFY.code;
        mem.paymentMeans = paymentMeans;
        mem.activationNote = (mem.category === 'associate_member') ? `Associate Fee Paid (${currentFY.label}) via ${paymentMeans}: ${description}` : description;
        mem.deactivationReason = null;

        let generatedInvoiceNo = null;

        if (createInvoice && memHead) {
          const existingMemInvoice = (this.data.payments || []).find(p =>
            p.status === 'success' &&
            this.isPaymentForMember(p, mem) &&
            (p.headCode === 'MEM' || (p.headTitle && p.headTitle.toLowerCase().includes('membership')) || (p.invoiceNo && p.invoiceNo.includes('/MEM/')))
          );

          if (existingMemInvoice) {
            generatedInvoiceNo = existingMemInvoice.invoiceNo;
          } else {
            const base = Number(this.getHeadPrice(memHead, mem.category) || (mem.category === 'associate_member' ? 5000 : 10000));
            const cgst = Math.round(base * 0.09 * 100) / 100;
            const sgst = Math.round(base * 0.09 * 100) / 100;
            const totalGst = Math.round((cgst + sgst) * 100) / 100;
            const totalAmount = Math.round((base + totalGst) * 100) / 100;

            const nextSerial = (this.data.invoiceCounter || 0) + 1;
            this.data.invoiceCounter = nextSerial;
            const serialStr = String(nextSerial).padStart(4, "0");
            generatedInvoiceNo = `CREA/${currentFY.code}/${memHead.code.toUpperCase()}/${serialStr}`;

            const paymentRecord = {
              id: `pay-${Date.now()}`,
              invoiceNo: generatedInvoiceNo,
              serial: nextSerial,
              date: new Date().toISOString(),
              headId: memHead.id,
              headCode: memHead.code,
              headTitle: memHead.title,
              payerType: "member",
              payerCategory: mem.category,
              payerId: mem.id,
              payerName: mem.name,
              payerMobile: mem.mobile,
              payerEmail: mem.email,
              payerGstin: mem.gstin || "",
              payerAddress: mem.address || "",
              attended: false,
              giftCollected: false,
              baseAmount: base,
              cgst,
              sgst,
              totalGst,
              totalAmount,
              status: "success",
              method: `Manual Admin (${paymentMeans}): ${description}`
            };

            this.data.payments.unshift(paymentRecord);
          }
        }

        try {
          await fetch("/api/member/activate-manual", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: memberId,
              paymentMeans,
              description,
              createInvoice,
              headId: memHead ? memHead.id : null
            })
          });
        } catch (err) {}

        this.normalizeData();
        this.saveToStorage();
        this.render();

        alert(`✓ Member '${mem.name}' has been successfully ACTIVATED for ${currentFY.label}!\n${generatedInvoiceNo ? `Tax Invoice ${generatedInvoiceNo} created.` : ''}`);
        this.openMembersModal();
      },

      // CAMERA QR SCANNER MODAL (Gate Entry & Welcome Gift)
      openScannerModal(headId, mode = 'attendance') {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        // RULE: Attendance and gift collection allowed if Live Mode is active in database or on the scheduled event day
        if (!this.isHeadLive(head) && head.eventDate) {
          const eventDateStr = this.getEventDateOnly(head.eventDate);
          const todayStr = this.getTodayDateOnly();
          if (eventDateStr !== todayStr) {
            const isEarly = eventDateStr > todayStr;
            const actionName = (mode === 'attendance' || mode === 'entry') ? 'Gate attendance check-in' : 'Welcome gift collection';
            alert(isEarly
              ? `⚠️ Check-In Kiosk Locked: "${head.title}" is scheduled for ${head.eventDate}.\n\n${actionName} is permitted on the scheduled event day, or when an Admin enables '🔴 Go Live' in the admin dashboard.`
              : `🔒 Check-In Kiosk Closed: "${head.title}" took place on ${head.eventDate}.\n\nTo reopen check-in, an Admin can enable '🔴 Go Live' in the admin dashboard.`);
            return;
          }
        }

        // RULE: Welcome gift collection requires explicit Admin approval
        if (mode === 'gift' && !head.giftEnabled) {
          alert(`🚫 Gift Distribution Disabled: Delegate Kit & Welcome Gift distribution for "${head.title}" has not been approved by Admin yet.\n\nPlease enable "Delegate Kit & Gift Approval" in Program Settings or the Delegate Tracker before opening the gift kiosk.`);
          return;
        }

        const isAttendance = mode === 'attendance' || mode === 'entry';
        const modalTitle = isAttendance ? "📷 Gate Entry & Attendance Scanner" : "🎁 Delegate Kit & Welcome Gift Collection";
        const accentColor = isAttendance ? "#38bdf8" : "#a855f7";

              <!-- Camera Viewport -->

                <div id="scanner-reticle" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 180px; height: 180px; border: 2px dashed rgba(255,255,255,0.6); border-radius: 12px; pointer-events: none;"></div>

                ${instruction}
              </div>

              <!-- Scan Result Box -->
              <div id="scanner-result" style="margin-top: 12px; display: none;"></div>

              <!-- Manual Entry Fallback -->
              <div style="margin-top: 16px; border-top: 1px solid var(--card-border); padding-top: 14px;">

                <div style="display: flex; gap: 8px;">
                  <input type="text" id="manual-scan-input" class="form-input" placeholder="e.g., CREA/2627/${head.code}/0001 or 9845012345" style="flex: 1; font-size: 12px;" onkeydown="if(event.key==='Enter') app.submitManualScan('${headId}', '${mode}')">

        this.startScannerCamera(headId, mode);
      },

      async startScannerCamera(headId, mode) {
        this._scannerRunning = true;
        this._scannerLastScanTime = 0;
        const video = document.getElementById("scanner-video");
        const statusBox = document.getElementById("scanner-status");

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          this._scannerStream = stream;
          if (video) {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            await video.play();
          }

          if (statusBox) statusBox.innerHTML = `🟢 <strong>Camera Active</strong>: Align QR code in frame...`;

          requestAnimationFrame(() => this.scanVideoLoop(headId, mode));
        } catch (err) {
          console.warn("Camera access failed or unavailable:", err);
          if (statusBox) {
            statusBox.innerHTML = `⚠️ <strong>Camera unavailable:</strong> ${err.message || 'Permission denied'}. Please use the manual fallback below.`;
            statusBox.style.color = "#f59e0b";
          }
        }
      },

      scanVideoLoop(headId, mode) {
        if (!this._scannerRunning) return;

        const video = document.getElementById("scanner-video");
        const canvas = document.getElementById("scanner-canvas");

        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
          if (!canvas) return;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          if (window.jsQR) {
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "dontInvert"
            });

            if (code && code.data) {
              const now = Date.now();
              if (now - this._scannerLastScanTime > 2500) {
                this._scannerLastScanTime = now;
                this.handleScannedPayload(code.data, headId, mode);
              }
            }
          }
        }

        if (this._scannerRunning) {
          requestAnimationFrame(() => this.scanVideoLoop(headId, mode));
        }
      },

      handleScannedPayload(payload, headId, mode = 'attendance') {
        const clean = (payload || '').trim();
        let targetInvoice = clean;
        let targetHeadCode = null;
        let targetMobile = null;
        let targetHeadId = null;

        if (clean.includes('|')) {
          const parts = clean.split('|');
          if (parts[0] === 'CREA' && parts.length >= 3) {
            const typeFlag = parts[1].toUpperCase();
            if (typeFlag === 'ENTRY') mode = 'attendance';
            if (typeFlag === 'GIFT') mode = 'gift';
            targetInvoice = parts[2].trim();
            if (parts.length >= 4) targetHeadCode = parts[3].trim();
            if (parts.length >= 5) targetMobile = parts[4].trim();
            if (parts.length >= 6) targetHeadId = parts[5].trim();
          }
        }

        const head = this.data.heads.find(h => h.id === headId);
        const resultBox = document.getElementById("scanner-result");
        const statusBox = document.getElementById("scanner-status");

        // STRICT MATCHING ORDER TO PREVENT FALSE-POSITIVE ANNUAL MEMBERSHIP MATCHES:
        let payment = null;

        // 1. Primary: Match by exact invoice number
        if (targetInvoice && targetInvoice !== 'CREA') {
          payment = this.data.payments.find(p => p.invoiceNo && p.invoiceNo.toUpperCase() === targetInvoice.toUpperCase());
        }

        // 2. If not found by invoice and payload has specific headCode + mobile
        if (!payment && targetHeadCode && targetMobile) {
          payment = this.data.payments.find(p =>
            p.payerMobile === targetMobile &&
            (p.headCode === targetHeadCode || (targetHeadId && p.headId === targetHeadId))
          );
        }

        // 3. If scanner is opened for a specific event head, match mobile specifically for this head
        if (!payment && head && targetMobile) {
          payment = this.data.payments.find(p =>
            p.payerMobile === targetMobile &&
            (p.headId === head.id || p.headCode === head.code)
          );
        }

        // 4. If targetInvoice is a 10-digit mobile number, match payment under current head first
        if (!payment && head && /^\d{10}$/.test(targetInvoice)) {
          payment = this.data.payments.find(p =>
            p.payerMobile === targetInvoice &&
            (p.headId === head.id || p.headCode === head.code)
          );
        }

        // 5. Fallback: match by ID or clean string containing invoice
        if (!payment) {
          payment = this.data.payments.find(p =>
            p.id === targetInvoice ||
            (p.invoiceNo && clean.includes(p.invoiceNo.toUpperCase()))
          );
        }

        if (!payment) {
          this.playBeep('error');
          if (resultBox) {
            resultBox.style.display = "block";
            resultBox.innerHTML = `
              <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 8px; padding: 12px; color: #fca5a5; font-size: 13px;">
                <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">❌ INVALID TICKET</div>
                <div>No paid registration record found matching: <strong>${targetInvoice}</strong></div>
              </div>
            `;
          }
          if (statusBox) statusBox.innerHTML = `<span style="color: #ef4444;">❌ Scan Rejected: Unrecognized ticket.</span>`;
          return;
        }

        if (head && payment.headId && payment.headId !== head.id && payment.headCode !== head.code) {
          this.playBeep('warning');
          if (resultBox) {
            resultBox.style.display = "block";
            resultBox.innerHTML = `
              <div style="background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; border-radius: 8px; padding: 12px; color: #fde68a; font-size: 13px;">
                <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">⚠️ WRONG EVENT TICKET</div>
                <div>This ticket is registered for: <strong>${payment.headTitle}</strong></div>
                <div style="margin-top: 4px; font-size: 11px; color: var(--text-muted);">Delegate: ${payment.payerName} (${payment.payerMobile})</div>
              </div>
            `;
          }
          if (statusBox) statusBox.innerHTML = `<span style="color: #f59e0b;">⚠️ Wrong event ticket presented.</span>`;
          return;
        }

        // RULE: Attendance and gift collection only allowed on the day of the event held
        const eventHead = head || this.data.heads.find(h => h.id === payment.headId || h.code === payment.headCode);
        if (eventHead && eventHead.eventDate) {
          const eventDateStr = this.getEventDateOnly(eventHead.eventDate);
          const todayStr = this.getTodayDateOnly();
          if (eventDateStr !== todayStr) {
            const isEarly = eventDateStr > todayStr;
            this.playBeep('warning');
            if (resultBox) {
              resultBox.style.display = "block";
              resultBox.innerHTML = `
                <div style="background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; border-radius: 10px; padding: 14px; color: #fca5a5;">
                  <div style="font-weight: 800; font-size: 15px; color: #f87171; margin-bottom: 6px;">
                    ⛔ CHECK-IN PROHIBITED: NOT EVENT DAY
                  </div>
                  <div style="font-size: 13px; color: #fff;">
                    <strong>${eventHead.title}</strong> is scheduled for <strong>${eventHead.eventDate}</strong>.
                  </div>
                  <div style="font-size: 12px; margin-top: 6px; line-height: 1.4;">

                  </div>
                </div>
              `;
            }
            if (statusBox) statusBox.innerHTML = `<span style="color: #ef4444;">⛔ Blocked: Can only mark on event day (${eventHead.eventDate}). Today is ${todayStr}.</span>`;
            return;
          }
        }

        const now = new Date();
        const timeStr = now.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });

        if (mode === 'attendance') {
          if (!payment.attended) {
            payment.attended = true;
            payment.attendedAt = now.toISOString();
            this.playBeep('success');

            if (resultBox) {
              resultBox.style.display = "block";
              resultBox.innerHTML = `
                <div style="background: rgba(16, 185, 129, 0.15); border: 2px solid #10b981; border-radius: 10px; padding: 14px; color: #6ee7b7;">
                  <div style="font-weight: 800; font-size: 16px; color: #34d399; margin-bottom: 6px;">
                    ✅ ENTRY GRANTED (First Check-In)
                  </div>

                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                    Mobile: <strong>${payment.payerMobile}</strong> • <span class="badge badge-${payment.payerCategory}">${payment.payerCategory.replace('_', ' ')}</span>
                  </div>
                  <div style="font-size: 11.5px; color: #38bdf8; margin-top: 6px;">
                    Invoice: ${payment.invoiceNo} • Paid ₹${payment.totalAmount.toLocaleString('en-IN')}
                  </div>
                  <div style="font-size: 11px; color: #a7f3d0; margin-top: 4px;">
                    🕒 Checked in at ${timeStr}
                  </div>
                </div>
              `;
            }
            if (statusBox) statusBox.innerHTML = `<span style="color: #34d399;">✅ <strong>${payment.payerName}</strong> marked as Present!</span>`;
          } else {
            this.playBeep('success');
            const prevTime = new Date(payment.attendedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });

            if (resultBox) {
              resultBox.style.display = "block";
              resultBox.innerHTML = `
                <div style="background: rgba(56, 189, 248, 0.15); border: 2px solid #38bdf8; border-radius: 10px; padding: 14px; color: #bae6fd;">
                  <div style="font-weight: 800; font-size: 16px; color: #38bdf8; margin-bottom: 6px;">
                    ℹ️ RE-ENTRY PERMITTED
                  </div>
                  <div style="font-size: 14px; color: #fff; font-weight: 700;">${payment.payerName}</div>
                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                    Mobile: <strong>${payment.payerMobile}</strong> • <span class="badge badge-${payment.payerCategory}">${payment.payerCategory.replace('_', ' ')}</span>
                  </div>
                  <div style="font-size: 11.5px; color: #93c5fd; margin-top: 6px;">
                    Invoice: ${payment.invoiceNo}
                  </div>
                  <div style="font-size: 11px; color: #60a5fa; margin-top: 4px;">
                    🕒 Original Entry Recorded: ${prevTime} (Access Permitted)
                  </div>
                </div>
              `;
            }
            if (statusBox) statusBox.innerHTML = `<span style="color: #38bdf8;">ℹ️ <strong>${payment.payerName}</strong> Re-Entry Verified.</span>`;
          }
        } else {
          if (eventHead && !eventHead.giftEnabled) {
            this.playBeep('error');
            if (resultBox) {
              resultBox.style.display = "block";
              resultBox.innerHTML = `
                <div style="background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; border-radius: 10px; padding: 14px; color: #fca5a5;">
                  <div style="font-weight: 800; font-size: 16px; color: #f87171; margin-bottom: 6px;">
                    🚫 GIFT COLLECTION DISABLED BY ADMIN
                  </div>
                  <div style="font-size: 13px; color: #fff;">
                    Welcome Gift / Takeaway Kit distribution for <strong>${eventHead.title}</strong> is currently locked.
                  </div>
                  <div style="font-size: 12px; margin-top: 6px; line-height: 1.4;">
                    An Admin must activate and approve gift distribution in the Program Settings or Delegate Tracker before gifts can be issued.
                  </div>
                </div>
              `;
            }
            if (statusBox) statusBox.innerHTML = `<span style="color: #ef4444;">🚫 Gift collection disabled: Admin approval required.</span>`;
            return;
          }

          if (!payment.giftCollected) {
            payment.giftCollected = true;
            payment.giftCollectedAt = now.toISOString();
            this.playBeep('success');

            if (resultBox) {
              resultBox.style.display = "block";
              resultBox.innerHTML = `
                <div style="background: rgba(168, 85, 247, 0.15); border: 2px solid #a855f7; border-radius: 10px; padding: 14px; color: #e9d5ff;">
                  <div style="font-weight: 800; font-size: 16px; color: #c084fc; margin-bottom: 6px;">
                    🎁 WELCOME GIFT / DELEGATE KIT HANDED OVER
                  </div>
                  <div style="font-size: 14px; color: #fff; font-weight: 700;">${payment.payerName}</div>
                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                    Mobile: <strong>${payment.payerMobile}</strong> • <span class="badge badge-${payment.payerCategory}">${payment.payerCategory.replace('_', ' ')}</span>
                  </div>
                  <div style="font-size: 11.5px; color: #c084fc; margin-top: 6px;">
                    Invoice: ${payment.invoiceNo}
                  </div>
                  <div style="font-size: 11px; color: #e9d5ff; margin-top: 4px;">
                    🕒 Claimed at ${timeStr}
                  </div>
                </div>
              `;
            }
            if (statusBox) statusBox.innerHTML = `<span style="color: #c084fc;">🎁 Delegate kit marked as collected for <strong>${payment.payerName}</strong>!</span>`;
          } else {
            this.playBeep('warning');
            const prevTime = new Date(payment.giftCollectedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });

            if (resultBox) {
              resultBox.style.display = "block";
              resultBox.innerHTML = `
                <div style="background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; border-radius: 10px; padding: 14px; color: #fca5a5;">
                  <div style="font-weight: 800; font-size: 16px; color: #f87171; margin-bottom: 6px;">
                    ⚠️ ALREADY CLAIMED: DUPLICATE KIT BLOCKED
                  </div>
                  <div style="font-size: 14px; color: #fff; font-weight: 700;">${payment.payerName}</div>
                  <div style="font-size: 12px; color: #fca5a5; margin-top: 2px;">
                    Mobile: <strong>${payment.payerMobile}</strong>
                  </div>
                  <div style="font-size: 12px; color: #fca5a5; margin-top: 6px;">
                    This delegate already collected their Welcome Gift at <strong>${prevTime}</strong>. Do NOT issue another gift kit!
                  </div>
                </div>
              `;
            }
            if (statusBox) statusBox.innerHTML = `<span style="color: #f87171;">⚠️ Duplicate Gift Claim Blocked for ${payment.payerName}.</span>`;
          }
        }

        this.saveToStorage();

        try {
          fetch("/api/attendance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },

              invoiceNo: payment.invoiceNo,

              mode
            })
          });
        } catch(err) {}
      },

      submitManualScan(headId, mode) {
        const input = document.getElementById("manual-scan-input");
        if (!input || !input.value.trim()) {
          alert("Please enter an Invoice Number or Registered Mobile Number.");
          return;
        }
        this.handleScannedPayload(input.value.trim(), headId, mode);
      },

      closeScannerModal(event) {
        if (event && event.target && event.target !== event.currentTarget) return;
        this.stopScanner();
        this.closeModal();
        this.render();
      },

      stopScanner() {
        this._scannerRunning = false;
        if (this._scannerStream) {
          try {
            this._scannerStream.getTracks().forEach(track => track.stop());
          } catch(err) {}
          this._scannerStream = null;
        }
      },

      playBeep(type = 'success') {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === 'success') {
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'warning') {
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(330, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.25);
          } else {
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.3);
          }
        } catch(e) {}
      },

      // DELEGATE ATTENDANCE & GIFT TRACKER (Roster)

        if (!head) return;

        const total = registrations.length;

        const giftCount = registrations.filter(p => p.giftCollected).length;

        const giftPct = total > 0 ? Math.round((giftCount / total) * 100) : 0;

        if (searchTerm) {
          const s = searchTerm.toLowerCase();
          registrations = registrations.filter(p => {
            const comp = this.getCompanyForPayment(p).toLowerCase();
            const mob = (p.payerMobile || "").toLowerCase();
            const email = (p.payerEmail || "").toLowerCase();
            const inv = (p.invoiceNo || "").toLowerCase();
            const gstin = (p.payerGstin || "").toLowerCase();
            const name = (p.payerName || "").toLowerCase();
            return name.includes(s) || comp.includes(s) || mob.includes(s) || email.includes(s) || inv.includes(s) || gstin.includes(s);
          });
        }

        document.getElementById("modal-root").innerHTML = `
          <div class="modal-overlay" onclick="app.closeModal(event)">
            <div class="modal-box" onclick="event.stopPropagation()" style="max-width: 960px;">
              <div class="modal-header">
                <div>
                  <h3 style="font-size: 18px; font-weight: 700;">📊 Delegate Attendance & Gift Tracker</h3>
                  <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">${head.title} (${head.eventDate || 'Scheduled'})</p>
                </div>
                <button class="modal-close" onclick="app.closeModal()">&times;</button>
              </div>

              <!-- Top Stats Summary -->
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px;">
                <div style="background: #090f1d; border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 16px;">
                  <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Total Registrations</div>
                  <div style="font-size: 24px; font-weight: 800; color: #fff; margin-top: 4px;">${total}</div>
                </div>
                <div style="background: #090f1d; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px; padding: 12px 16px;">
                  <div style="font-size: 11px; color: #38bdf8; text-transform: uppercase;">Gate Check-In (${attendedPct}%)</div>
                  <div style="font-size: 24px; font-weight: 800; color: #38bdf8; margin-top: 4px;">${attendedCount} / ${total}</div>
                </div>
                <div style="background: #090f1d; border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 10px; padding: 12px 16px;">
                  <div style="font-size: 11px; color: #c084fc; text-transform: uppercase;">Gifts Collected (${giftPct}%)</div>
                  <div style="font-size: 24px; font-weight: 800; color: #c084fc; margin-top: 4px;">${giftCount} / ${total}</div>
                </div>
              </div>

              <!-- Event Date & Live Status Policy Notice -->

      async toggleAttendance(invoiceNo, headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!this.isHeadLive(head) && head && head.eventDate) {
          const eventDateStr = this.getEventDateOnly(head.eventDate);
          const todayStr = this.getTodayDateOnly();
          if (eventDateStr !== todayStr) {
            const isEarly = eventDateStr > todayStr;
            alert(isEarly
              ? `⚠️ Check-in is not permitted before the event date.\n\n"${head.title}" is scheduled for ${head.eventDate}.\nTo open check-in now, click '🔴 Go Live' on this event in the admin dashboard.`
              : `🔒 Check-in is closed.\n\n"${head.title}" took place on ${head.eventDate}.\nTo reopen check-in, click '🔴 Go Live' on this event in the admin dashboard.`);
            return;
          }
        }
        const payment = this.data.payments.find(p => p.invoiceNo === invoiceNo);
        if (!payment) return;
        payment.attended = !payment.attended;
        payment.attendedAt = payment.attended ? new Date().toISOString() : null;
        this.saveToStorage();
        this.openDelegateTracker(headId);

        // Sync immediately to server & Supabase database
        try {
          await fetch("/api/attendance", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              invoiceNo: payment.invoiceNo,
              headId: head ? head.id : null,
              mode: "attendance",
              action: "toggle",
              forceToggle: true
            })
          });
        } catch(e) {}
      },

      async toggleGift(invoiceNo, headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (head && !head.giftEnabled) {
          alert(`🚫 Gift Distribution Disabled: Delegate Kit & Welcome Gift distribution for "${head.title}" has not been approved by Admin yet.\n\nPlease click "🎁 Approve Gifts Now" in the banner above before marking gifts.`);

        if (!this.isHeadLive(head) && head && head.eventDate) {
          const eventDateStr = this.getEventDateOnly(head.eventDate);
          const todayStr = this.getTodayDateOnly();
          if (eventDateStr !== todayStr) {
            const isEarly = eventDateStr > todayStr;
            alert(isEarly
              ? `⚠️ Gift collection is not permitted before the event date.\n\n"${head.title}" is scheduled for ${head.eventDate}.\nTo open gift distribution now, click '🔴 Go Live' on this event in the admin dashboard.`
              : `🔒 Gift collection is closed.\n\n"${head.title}" took place on ${head.eventDate}.\nTo reopen gift distribution, click '🔴 Go Live' on this event in the admin dashboard.`);

        payment.giftCollectedAt = payment.giftCollected ? new Date().toISOString() : null;

      },

      getCompanyForPayment(p) {
        if (!p) return "";
        if (p.payerCompany && p.payerCompany.trim() && p.payerCompany !== "Independent Realtor" && p.payerCompany !== "Independent Broker") {
          return p.payerCompany.trim();
        }
        const mem = (this.data.members || []).find(m =>
          (p.payerId && m.id === p.payerId) ||
          (p.payerMobile && this.cleanMobile(m.mobile) === this.cleanMobile(p.payerMobile)) ||
          (p.payerEmail && m.email && m.email.trim().toLowerCase() === (p.payerEmail || "").trim().toLowerCase()) ||
          (m.name && m.name.trim().toLowerCase() === (p.payerName || "").trim().toLowerCase())
        );
        if (mem && mem.company && mem.company.trim() && mem.company !== "Independent Realtor") {
          return mem.company.trim();
        }
        if (p.payerCompany && p.payerCompany.trim()) return p.payerCompany.trim();
        if (mem && mem.company && mem.company.trim()) return mem.company.trim();
        return p.payerCategory === "non_member" ? "Independent Delegate" : "CREA Member Brokerage";
      },

      exportDelegateCSV(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        const registrations = this.data.payments.filter(p => p.headId === headId || p.headCode === head.code || p.headTitle === head.title);

        const rows = [
          [
            "Sl No",
            "Invoice No",
            "Attendee Name",
            "Company Name",
            "Mobile Number",
            "Email ID",
            "Category",
            "Gate Attendance",
            "Attendance Timestamp",
            "Welcome Gift Status",
            "Gift Timestamp",
            "Total Paid (INR)",
            "Payment Status",
            "Payment Method",
            "Payer GSTIN",
            "Billing Address",
            "Registration Date"
          ]
        ];

        const formatTimestamp = (ts) => {
          if (!ts) return "";
          try {
            const d = new Date(ts);
            if (isNaN(d.getTime())) return ts;
            return d.toLocaleString("en-IN", { timeZone: "Asia/Kolkata", dateStyle: "medium", timeStyle: "short" });
          } catch (e) {
            return ts;
          }
        };

        const escapeCsv = (val) => {
          const s = String(val == null ? "" : val);
          if (s.includes(",") || s.includes('"') || s.includes("\n") || s.includes("\r")) {
            return `"${s.replace(/"/g, '""')}"`;
          }
          return s;
        };

        registrations.forEach((p, idx) => {
          const companyName = this.getCompanyForPayment(p);
          const mobile = (p.payerMobile || "").trim();
          const email = (p.payerEmail || "").trim();

          rows.push([
            idx + 1,
            escapeCsv(p.invoiceNo),
            escapeCsv(p.payerName),
            escapeCsv(companyName),
            escapeCsv(mobile),
            escapeCsv(email),
            escapeCsv((p.payerCategory || "").replace(/_/g, " ").toUpperCase()),
            p.attended ? "ATTENDED (YES)" : "NOT ATTENDED (NO)",
            escapeCsv(formatTimestamp(p.attendedAt)),
            p.giftCollected ? "ISSUED (YES)" : "NOT ISSUED (NO)",
            escapeCsv(formatTimestamp(p.giftCollectedAt)),
            Number(p.totalAmount || 0),
            escapeCsv((p.status || "success").toUpperCase()),
            escapeCsv(p.method || "Online Gateway"),
            escapeCsv(p.payerGstin || ""),
            escapeCsv(p.payerAddress || ""),
            escapeCsv(formatTimestamp(p.date))
          ]);
        });

        const csvText = rows.map(r => r.join(",")).join("\r\n");
        // UTF-8 Byte Order Mark (\uFEFF) ensures Microsoft Excel properly displays Indian names, special characters, and formatting
        const blob = new Blob(["\uFEFF" + csvText], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        const safeHeadCode = (head.code || "EVENT").replace(/[^a-zA-Z0-9_-]/g, "_");
        link.setAttribute("download", `CREA_Attendance_Gift_Roster_${safeHeadCode}_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      },

            id: `pay-${Date.now()}-${i}`,
            invoiceNo,
            serial: nextSerial,
            date: new Date(Date.now() - Math.floor(Math.random() * 86400000 * 25)).toISOString(),
            headId: head.id,
            headCode: head.code,
            headTitle: head.title,
            payerType,
            payerCategory: cat,
            payerId,
            payerName: payer.name,
            payerMobile: payer.mobile,
            payerEmail: payer.email,
            payerGstin: payer.gstin || "",
            payerAddress: payer.address || "",
            attended: Math.random() > 0.5,
            attendedAt: new Date().toISOString(),
            giftCollected: Math.random() > 0.6,
            giftCollectedAt: new Date().toISOString(),
            baseAmount: base,
            cgst,
            sgst,
            totalGst,
            totalAmount,
            status: "success",
            method: "Simulated Direct"
          });
        }

        this.normalizeData();
        this.saveToStorage();
        alert("Simulated 10 additional transactions successfully!");
        this.render();
      },

      // RESET ALL PAYMENTS
      resetAllPayments() {
        if (!confirm("Are you sure you want to clear all payments and reset invoice numbering back to 0001?")) return;
        this.data.payments = [];
        this.data.emailLogs = [];
        this.data.invoiceCounter = 0;
        this.normalizeData();
        this.saveToStorage();
        alert("All payments cleared. Invoice numbering reset to 0001.");
        this.render();
      }
    };
    window.app = app;

    // Initialize application on page load
    window.addEventListener("DOMContentLoaded", () => {
      app.init();
    });
  </script>
</body>
</html>
