<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CREA(I) — Real Estate Payment & Membership Management Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/jsqr.min.js"></script>
  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/fontkit.umd.min.js"></script>
  <script>
    if (typeof qrcode === 'undefined') {
      const s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js";
      document.head.appendChild(s);
    }
    if (typeof jsQR === 'undefined') {
      const s2 = document.createElement('script');
      s2.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
      document.head.appendChild(s2);
    }
    if (typeof PDFLib === 'undefined') {
      const s3 = document.createElement('script');
      s3.src = "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";
      document.head.appendChild(s3);
    }
  </script>
  <style>
    :root {
      --bg-dark: #070b14;
      --card-bg: #0d1527;
      --card-border: #1e293d;
      --card-hover: #162035;
      --primary: #2563eb;
      --primary-light: #38bdf8;
      --primary-dark: #1d4ed8;
      --gold: #f59e0b;
      --gold-light: #fcd34d;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Notice Bar */
    .top-strip {
      background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 8px 24px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .top-strip .tag {
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Navigation Header */
    header {
      background: rgba(13, 21, 39, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-text p {
      font-size: 11.5px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      background: #090f1d;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .nav-btn.active {
      background: #1e293b;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }

    .nav-btn:hover:not(.active) {
      color: #f1f5f9;
      background: rgba(255, 255, 255, 0.04);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px 24px;
    }

    /* Cards & Containers */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .glass-card:hover {
      border-color: #2b3a55;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-member { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-associate_member { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-new_member { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-board_member { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-non_member { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-paid { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-open { background: rgba(37, 99, 235, 0.15); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.3); }
    .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .badge-deactivated { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }

    @keyframes scanLaser {
      0% { top: 6%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 6%; opacity: 0.8; }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.16s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
      transform: translateY(-1px);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    }
    .btn-success:hover {
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: #27354a;
      color: #ffffff;
    }

    .btn-outline {
      background: transparent;
      color: var(--primary-light);
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .btn-outline:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Grid Layouts */
    .heads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
      margin-top: 24px;
    }

    .head-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }
    .head-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-box {
      background: #0e1629;
      border: 1px solid #1f2d47;
      border-radius: 18px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      padding: 28px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .modal-close:hover { color: #ffffff; }

    /* Inputs */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      background: #090f1e;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary-light);
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      background: #090f1d;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--card-border);
    }

    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #141f33;
      color: #e2e8f0;
    }

    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .data-table tfoot td {
      background: #080e1d;
      color: #ffffff;
      padding: 13px 14px;
      border-top: 2px solid rgba(56, 189, 248, 0.45);
      border-bottom: 2px solid rgba(56, 189, 248, 0.45);
    }

    /* Print Invoice Styling */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-invoice-container, #printable-invoice-container * {
        visibility: visible;
      }
      #printable-invoice-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 20px !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Top Strip -->
  <div class="top-strip">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="tag">CREA(I)</span>
      <span>Confederation of Real Estate Associates (India) • Payment & Invoicing Hub</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; color: var(--text-muted);">
      <span>Financial Year: <strong style="color: #38bdf8;">2026-2027 (FY2627)</strong></span>
      <span>GSTIN: <strong style="color: #ffffff;">29AAAAA0000A1Z5</strong> (18% GST Applicable)</span>
    </div>
  </div>

  <!-- 2. Header Bar -->
  <header>
    <div class="brand-container" onclick="app.switchTab('member')">
      <div class="brand-logo">🏛️</div>
      <div class="brand-text">
        <h1>CREA(I) <span>PAY</span></h1>
        <p>Real Estate Associate Payment Portal</p>
      </div>
    </div>

    <!-- Segmented Mode Switcher -->
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-btn-member" onclick="app.switchTab('member')">
        👤 Member Portal
      </button>
      <button class="nav-btn" id="tab-btn-guest" onclick="app.switchTab('guest')">
        👥 Non-Member / Guest
      </button>
      <button class="nav-btn" id="tab-btn-admin" onclick="app.switchTab('admin')">
        🛡️ Admin Portal
      </button>
    </div>
  </header>

  <!-- 3. Main Workspace Container -->
  <main id="app-viewport">
    <!-- Dynamic views rendered via JavaScript -->
  </main>

  <!-- 4. Global Modals Placeholder -->
  <div id="modal-root"></div>

  <!-- 5. Application Core Logic -->
  <script>
    // State Store (Auto-initializes with demo data in localStorage if server is not present)
    const app = {
      currentTab: "member",
      loggedInMember: null, // Holds active member profile
      guestInfo: { name: "", mobile: "", email: "", gstin: "", address: "" },
      adminPin: "crea-admin",
      isAdminAuthenticated: false,
      activeScannerStream: null,
      scannerAnimFrame: null,
      lastScannedCode: null,
      lastScanTime: 0,
      
      // Filters for Admin
      adminFilter: {
        head: "all",
        type: "all", // all | member | non_member
        fromMonth: "2026-08",
        toMonth: "2026-12",
        search: ""
      },

      data: null, // Will load from server or fallback localStorage

      async init() {
        // Fetch data from local Node server or fallback
        try {
          const res = await fetch("/api/data");
          if (res.ok) {
            const json = await res.json();
            this.data = json.data;
          } else {
            throw new Error("Local API offline");
          }
        } catch (e) {
          console.log("Using browser offline storage");
          this.loadFromStorage();
        }

        // Ensure heads have status
        this.normalizeData();

        // Restore member session
        const savedMember = localStorage.getItem("crea_member");
        if (savedMember) {
          try { this.loggedInMember = JSON.parse(savedMember); } catch(e){}
        }

        this.render();
      },

      loadFromStorage() {
        const stored = localStorage.getItem("crea_data_store");
        if (stored) {
          this.data = JSON.parse(stored);
        } else {
          // Initialize default store
          this.data = this.getDefaultStore();
          this.saveToStorage();
        }
        this.normalizeData();
      },

      getFinancialYear(date = new Date()) {
        const d = new Date(date);
        const year = d.getFullYear();
        const month = d.getMonth() + 1; // 1-12
        let startYear, endYear;
        if (month >= 4) {
          startYear = year;
          endYear = year + 1;
        } else {
          startYear = year - 1;
          endYear = year;
        }
        const startStr = String(startYear).slice(-2);
        const endStr = String(endYear).slice(-2);
        return {
          code: `${startStr}${endStr}`,
          label: `FY ${startYear}-${String(endYear).slice(-2)}`,
          fullLabel: `${startYear}-${endYear}`,
          startYear,
          endYear
        };
      },

      normalizeData() {
        if (!this.data) return;
        if (!this.data.heads) this.data.heads = [];
        this.data.heads.forEach(h => {
          if (!h.status) h.status = "active";
          if (h.prices && h.prices.new_member !== undefined && h.prices.associate_member === undefined) {
            h.prices.associate_member = h.prices.new_member;
          }
        });

        if (!this.data.members) this.data.members = [];
        const fy = this.getFinancialYear();

        // Pass 1: Evaluate Regular & Board Members
        this.data.members.forEach(m => {
          if (m.category === "new_member") m.category = "associate_member";

          if (m.category !== "associate_member") {
            const hasPaidCurrentFY = m.lastPaidFY === fy.code || (this.data.payments || []).some(p =>
              (p.payerId === m.id || p.payerMobile === m.mobile) &&
              (p.headCode === "MEM" || (p.headTitle && p.headTitle.toLowerCase().includes("membership"))) &&
              p.status === "success" &&
              (p.invoiceNo && p.invoiceNo.includes(fy.code))
            );

            if (hasPaidCurrentFY) {
              if (m.status !== "deactivated_manual") {
                m.status = "active";
                m.lastPaidFY = fy.code;
              }
            } else {
              // 1st April Rule: Deactivate if unpaid for current FY
              if (m.status !== "active_manual") {
                m.status = "deactivated";
                m.activationNote = m.activationNote || `Pending ${fy.label} Annual Renewal`;
              }
            }
          }
        });

        // Pass 2: Evaluate Associate Members (DEPENDENT on Main Member!)
        this.data.members.forEach(m => {
          if (m.category === "associate_member") {
            const mainMember = this.data.members.find(p => p.id === m.parentMemberId || p.mobile === m.parentMemberMobile);
            const isMainMemberActive = mainMember && mainMember.status === "active" && mainMember.lastPaidFY === fy.code;

            const hasAssociatePaid = m.lastPaidFY === fy.code || (this.data.payments || []).some(p =>
              (p.payerId === m.id || p.payerMobile === m.mobile) &&
              (p.headCode === "MEM" || (p.headTitle && p.headTitle.toLowerCase().includes("membership"))) &&
              p.status === "success" &&
              (p.invoiceNo && p.invoiceNo.includes(fy.code))
            );

            // Strict Rule: Main member MUST be active and paid.
            // If main member is unpaid, associate is DEACTIVATED irrespective of associate payment!
            if (!isMainMemberActive) {
              m.status = "deactivated";
              m.deactivationReason = `Main Member (${mainMember ? mainMember.name : "Unassigned"}) membership unpaid for ${fy.label}`;
              m.activationNote = `Deactivated: Main Member (${mainMember ? mainMember.name : "Unassigned"}) has not paid FY dues`;
            } else if (!hasAssociatePaid) {
              m.status = "deactivated";
              m.deactivationReason = `Associate Member renewal fee pending for ${fy.label}`;
              m.activationNote = `Pending Associate Member Renewal for ${fy.label}`;
            } else {
              m.status = "active";
              m.lastPaidFY = fy.code;
            }
          }
        });

        // Sync loggedInMember session if active
        if (this.loggedInMember) {
          const fresh = this.data.members.find(m => m.id === this.loggedInMember.id || m.mobile === this.loggedInMember.mobile);
          if (fresh) {
            this.loggedInMember = { ...fresh };
          }
        }
      },

      generateQR(payload, size = 3) {
        if (typeof qrcode !== 'undefined') {
          try {
            const qr = qrcode(0, 'M');
            qr.addData(payload);
            qr.make();
            return qr.createSvgTag(size, 2);
          } catch(e) {
            console.warn("QR generation error:", e);
          }
        }
        return `<svg width="85" height="85" viewBox="0 0 100 100" style="background:#0f172a; border-radius:4px;"><rect width="100" height="100" fill="#0f172a"/><text x="50" y="55" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="monospace">QR PASS</text></svg>`;
      },

      escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      },

      saveToStorage() {
        localStorage.setItem("crea_data_store", JSON.stringify(this.data));
      },

      getDefaultStore() {
        const fy = this.getFinancialYear();
        return {
          invoiceCounter: 14,
          members: [
            { id: "mem-001", name: "Ramesh Gupta", mobile: "9800000001", email: "ramesh.gupta@crea-realty.in", category: "member", company: "Apex Prime Realty", city: "Bangalore", gstin: "29AABCR1234F1Z5", address: "Suite 401, Prestige Meridian, MG Road, Bangalore, Karnataka - 560001", status: "active", lastPaidFY: fy.code, paymentMeans: "Online Gateway", activationNote: `Paid Online (Inv: CREA/${fy.code}/MEM/0001)` },

      // TAB 2: NON-MEMBER (GUEST) CHECKOUT

          return !isDeactivated && !isDeleted && !isExpired && hasPrice;

        const guestEmail = (this.guestInfo.email || "").trim().toLowerCase();

          const matchMob = guestMobile && p.payerMobile === guestMobile;

                          <span style="color: var(--text-muted);">GST (18% - CGST 9% + SGST 9%):</span>
                          <span style="color: #38bdf8; font-weight: 600;">+₹${(cgst + sgst).toLocaleString('en-IN')}</span>

                <h2 style="font-size: 20px; font-weight: 700;">Admin Authentication</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Enter the CREA(I) administrator secret PIN</p>
              </div>

              <div style="background: #090f1e; border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: var(--text-muted);">
                Authorized Trial PIN: <strong style="color: #38bdf8;">crea-admin</strong>
              </div>

              <form onsubmit="app.handleAdminLogin(event)">
                <div class="form-group">
                  <label class="form-label">Admin Secret PIN</label>
                  <input type="password" id="admin-pin-input" required placeholder="Enter PIN" class="form-input">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                  Access Management Dashboard →
                </button>
              </form>
            </div>
          `;
        }

        // Admin is Authenticated
        const payments = this.data.payments;
        const totalGross = payments.reduce((acc, p) => acc + p.totalAmount, 0);
        const totalBase = payments.reduce((acc, p) => acc + p.baseAmount, 0);
        const totalGst = payments.reduce((acc, p) => acc + p.totalGst, 0);
        const memberCount = payments.filter(p => p.payerType === 'member').length;
        const memberRev = payments.filter(p => p.payerType === 'member').reduce((acc, p) => acc + p.totalAmount, 0);
        const guestCount = payments.filter(p => p.payerType === 'non_member').length;
        const guestRev = payments.filter(p => p.payerType === 'non_member').reduce((acc, p) => acc + p.totalAmount, 0);

        // Filtered Payments
        const filteredPayments = payments.filter(p => {
          if (this.adminFilter.head !== 'all' && p.headCode !== this.adminFilter.head) return false;
          if (this.adminFilter.type !== 'all' && p.payerType !== this.adminFilter.type) return false;
          if (this.adminFilter.search) {
            const q = this.adminFilter.search.toLowerCase();
            const matchName = p.payerName && p.payerName.toLowerCase().includes(q);
            const matchInv = p.invoiceNo && p.invoiceNo.toLowerCase().includes(q);
            const matchMob = p.payerMobile && p.payerMobile.includes(q);
            const matchHead = p.headCode && p.headCode.toLowerCase().includes(q);
            const matchTitle = p.headTitle && p.headTitle.toLowerCase().includes(q);
            if (!matchName && !matchInv && !matchMob && !matchHead && !matchTitle) return false;
          }
          return true;
        });

        // Dynamic Aggregations of the Filtered Set
        const filteredCount = filteredPayments.length;
        const filteredBase = filteredPayments.reduce((acc, p) => acc + (p.baseAmount || 0), 0);
        const filteredGst = filteredPayments.reduce((acc, p) => acc + (p.totalGst || 0), 0);
        const filteredGross = filteredPayments.reduce((acc, p) => acc + (p.totalAmount || 0), 0);
        const filteredMems = filteredPayments.filter(p => p.payerType === 'member').length;
        const filteredGuests = filteredPayments.filter(p => p.payerType === 'non_member').length;

        // Group filtered payments by head to calculate dynamic head-wise totals
        const headTotals = {};
        filteredPayments.forEach(p => {
          const code = p.headCode || 'OTHER';
          if (!headTotals[code]) {
            headTotals[code] = {
              code,
              title: p.headTitle || code,
              count: 0,
              base: 0,
              gst: 0,
              gross: 0,
              mems: 0,
              guests: 0
            };
          }
          headTotals[code].count += 1;
          headTotals[code].base += (p.baseAmount || 0);
          headTotals[code].gst += (p.totalGst || 0);
          headTotals[code].gross += (p.totalAmount || 0);
          if (p.payerType === 'member') headTotals[code].mems += 1;
          else headTotals[code].guests += 1;
        });
        const filteredHeadList = Object.values(headTotals);

        return `
          <!-- Admin Action Bar -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
            <div>
              <h2 style="font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px;">
                <span>CREA(I) Administrator Console</span>
                <span class="badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">LIVE BACKEND</span>
              </h2>
              <p style="font-size: 13px; color: var(--text-muted);">Real-time collections, discriminatory heads, member registry & invoice ledger.</p>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <button onclick="app.openNewHeadModal()" class="btn btn-primary btn-sm">
                + Create Payment Head
              </button>
              <button onclick="app.openMembersModal()" class="btn btn-secondary btn-sm">
                👥 Manage Members (${this.data.members.length})
              </button>
              <button onclick="app.triggerYearlyRenewal()" class="btn btn-outline btn-sm">
                🔄 Activate 1-Click Renewal
              </button>
              <button onclick="app.exportCSV()" class="btn btn-secondary btn-sm">
                📥 Export CSV
              </button>
              <button onclick="app.simulatePayments()" class="btn btn-secondary btn-sm" title="Add 10 test payments">
                ⚡ Simulate 10
              </button>
              <button onclick="app.resetAllPayments()" class="btn btn-secondary btn-sm" style="color: #f87171;" title="Wipe all payments & reset invoice counter to 0001">
                🗑️ Reset All
              </button>
              <button onclick="app.logoutAdmin()" class="btn btn-secondary btn-sm">
                Lock Admin
              </button>
            </div>
          </div>

          <!-- 1st April Auto-Deactivation & Annual Renewal Reminder for Admin -->
          ${!this.data.heads.some(h => (h.code === 'MEM' || h.type === 'membership') && h.status === 'active') ? `
            <div class="glass-card" style="border: 2px solid #f59e0b; background: linear-gradient(135deg, rgba(245, 158, 11, 0.16) 0%, rgba(120, 53, 15, 0.1) 100%); margin-bottom: 24px; padding: 20px 24px;">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
                <div style="display: flex; gap: 14px; align-items: center;">
                  <span style="font-size: 34px;">🔔</span>
                  <div>
                    <h3 style="font-size: 16px; font-weight: 800; color: #fde68a; margin-bottom: 4px;">
                      Annual Notice: Create & Activate Membership Renewal Head for ${this.getFinancialYear().label}
                    </h3>
                    <p style="font-size: 13px; color: #fef3c7; margin: 0; line-height: 1.5; max-width: 720px;">
                      As on 1st April of every year, all CREA(I) memberships are automatically set to deactivated pending new financial year dues.
                      Currently, no active membership payment head is open for <strong>${this.getFinancialYear().label}</strong>.
                      Activate or create the <strong>${this.getFinancialYear().label} Membership</strong> head so members can pay online and automatically reactivate their verified membership standing.
                    </p>
                  </div>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                  <button onclick="app.triggerYearlyRenewal()" class="btn btn-primary" style="background: #f59e0b; border-color: #d97706; color: #000; font-weight: 800; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);">
                    🔄 Activate ${this.getFinancialYear().label} Renewal Head Now
                  </button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- 4 KPI Stat Cards -->
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 28px;">
            <div class="glass-card" style="border-top: 3px solid #38bdf8;">
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Total Collections (Gross)</div>
              <div style="font-size: 28px; font-weight: 800; color: #ffffff; margin-top: 4px;">₹${totalGross.toLocaleString('en-IN')}</div>
              <div style="font-size: 11.5px; color: #38bdf8; margin-top: 4px;">Across ${payments.length} verified transactions</div>
            </div>

            <div class="glass-card" style="border-top: 3px solid #34d399;">
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Base Value (Taxable)</div>
              <div style="font-size: 28px; font-weight: 800; color: #34d399; margin-top: 4px;">₹${totalBase.toLocaleString('en-IN')}</div>
              <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">Excludes GST component</div>
            </div>

            <div class="glass-card" style="border-top: 3px solid #f59e0b;">
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">18% GST Collected</div>
              <div style="font-size: 28px; font-weight: 800; color: #fbbf24; margin-top: 4px;">₹${totalGst.toLocaleString('en-IN')}</div>
              <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 4px;">CGST 9% (₹${(totalGst/2).toLocaleString('en-IN')}) + SGST 9%</div>
            </div>

            <div class="glass-card" style="border-top: 3px solid #a855f7;">
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase;">Members vs Non-Members</div>
              <div style="font-size: 18px; font-weight: 700; color: #ffffff; margin-top: 8px;">
                ${memberCount} Members <span style="font-size: 13px; color: #38bdf8;">(₹${memberRev.toLocaleString('en-IN')})</span>
              </div>
              <div style="font-size: 13.5px; color: var(--text-muted); margin-top: 4px;">
                ${guestCount} Guests <span style="font-size: 12px; color: #fcd34d;">(₹${guestRev.toLocaleString('en-IN')})</span>
              </div>
            </div>
          </div>

          <!-- Head-wise Management & Registrations -->
          <div class="glass-card" style="margin-bottom: 28px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
              <div>
                <h3 style="font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                  <span>⚙️ Program, Training & Membership Management (Payment Heads)</span>
                  <span class="badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);">
                    ${this.data.heads.length} Programs

                </h3>
                <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 3px;">

              </div>
              <button onclick="app.openNewHeadModal()" class="btn btn-primary btn-sm">

            <div style="overflow-x: auto;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th style="min-width: 240px;">Program / Training / Membership</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th style="min-width: 210px;">Configured Prices (excl. GST)</th>
                    <th style="min-width: 150px;">Registrations & Attendance</th>
                    <th>Total Gross (incl. 18%)</th>
                    <th style="min-width: 280px; text-align: center;">Kiosk & Management Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${this.data.heads.map(h => {
                    const hPays = payments.filter(p => p.headId === h.id || p.headCode === h.code);
                    const mems = hPays.filter(p => p.payerType === 'member');
                    const guests = hPays.filter(p => p.payerType === 'non_member');
                    const attendedCount = hPays.filter(p => p.attended).length;
                    const giftCount = hPays.filter(p => p.giftCollected).length;
                    const gross = hPays.reduce((acc, p) => acc + p.totalAmount, 0);
                    const isDeleted = h.status === 'deleted' || h.isDeleted;
                    const isDeactivated = h.status === 'deactivated' || h.status === 'inactive';
                    const isExpired = h.activeUntil && new Date(h.activeUntil) < new Date();

                    const pAssoc = (h.prices?.associate_member ?? h.prices?.new_member) != null ? `₹${Number(h.prices.associate_member ?? h.prices.new_member).toLocaleString('en-IN')}` : '-';
                    const pMem = h.prices?.member != null ? `₹${Number(h.prices.member).toLocaleString('en-IN')}` : '-';
                    const pBrd = h.prices?.board_member != null ? `₹${Number(h.prices.board_member).toLocaleString('en-IN')}` : '-';
                    const pGst = h.prices?.non_member != null ? `₹${Number(h.prices.non_member).toLocaleString('en-IN')}` : '<span style="color: var(--text-dim);">Restricted</span>';

                    return `
                      <tr style="${isDeleted ? 'background: rgba(148, 163, 184, 0.05); opacity: 0.8;' : isDeactivated ? 'background: rgba(239, 68, 68, 0.04);' : ''}">
                        <td>
                          <div>
                            <strong style="color: ${isDeleted ? '#94a3b8' : isDeactivated ? '#cbd5e1' : '#ffffff'}; font-size: 13.5px;">${h.title}</strong>
                            <div style="font-size: 11px; color: #38bdf8; margin-top: 3px;">
                              Code: <strong>${h.code}</strong> • Event: ${h.eventDate || 'N/A'} • Closes: ${new Date(h.activeUntil).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}
                            </div>
                          </div>
                        </td>
                        <td><span class="badge badge-open">${h.type.toUpperCase()}</span></td>
                        <td>
                          ${isDeleted ? `
                            <span class="badge" style="background: rgba(148, 163, 184, 0.2); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.4);">
                              🗑️ DELETED
                            </span>
                          ` : isDeactivated ? `
                            <span class="badge" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);">
                              ⏸ DEACTIVATED
                            </span>
                          ` : isExpired ? `
                            <span class="badge" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4);">
                              ⌛ EXPIRED
                            </span>
                          ` : `
                            <span class="badge" style="background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);">
                              ● ACTIVE
                            </span>
                          `}
                        </td>
                        <td style="font-size: 11.5px; line-height: 1.5;">
                          <div><span style="color: var(--text-dim);">Assoc Mem:</span> <strong style="color: #fbbf24;">${pAssoc}</strong></div>
                          <div><span style="color: var(--text-dim);">Reg Mem:</span> <strong style="color: #38bdf8;">${pMem}</strong></div>
                          <div><span style="color: var(--text-dim);">Board:</span> <strong style="color: #c084fc;">${pBrd}</strong></div>
                          <div><span style="color: var(--text-dim);">Guest:</span> <strong>${pGst}</strong></div>
                        </td>
                        <td>
                          <strong>${hPays.length}</strong>
                          <div style="font-size: 11px; color: var(--text-muted);">${mems.length} Mems / ${guests.length} Guests</div>
                          ${h.type !== 'membership' ? `
                            <div style="font-size: 11px; color: #38bdf8; margin-top: 4px;">
                              Gate: <strong style="color: #34d399;">${attendedCount}/${hPays.length}</strong> • Gifts: <strong style="color: #fbbf24;">${giftCount}/${hPays.length}</strong>
                            </div>
                          ` : ''}
                        </td>
                        <td style="color: #34d399; font-weight: 700; font-size: 13.5px;">₹${gross.toLocaleString('en-IN')}</td>
                        <td style="text-align: center;">
                          <div style="display: flex; gap: 5px; align-items: center; justify-content: center; flex-wrap: wrap;">
                            <button onclick="app.openEditHeadModal('${h.id}')" class="btn btn-outline btn-sm" style="padding: 4px 8px; font-size: 11.5px;" title="Modify title, extend dates, increase/decrease prices">
                              ✏️ Modify
                            </button>
                            ${isDeleted ? `
                              <button onclick="app.toggleHeadStatus('${h.id}')" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 11.5px; color: #38bdf8; border-color: rgba(56, 189, 248, 0.4);" title="Restore this program to active status">
                                ▶ Restore
                              </button>
                            ` : isDeactivated ? `
                              <button onclick="app.toggleHeadStatus('${h.id}')" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 11.5px; color: #34d399; border-color: rgba(16, 185, 129, 0.4);" title="Reactivate this training or membership">
                                ▶ Activate
                              </button>
                              <button onclick="app.confirmDeleteHead('${h.id}')" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 11.5px; color: #ef4444; border-color: rgba(239, 68, 68, 0.4);" title="Delete / archive this program">
                                🗑️ Delete
                              </button>
                            ` : `
                              <button onclick="app.toggleHeadStatus('${h.id}')" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 11.5px; color: #f87171; border-color: rgba(239, 68, 68, 0.4);" title="Deactivate this program (omits from payment pages)">
                                ⏸ Deactivate
                              </button>
                              <button onclick="app.confirmDeleteHead('${h.id}')" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 11.5px; color: #ef4444; border-color: rgba(239, 68, 68, 0.4);" title="Delete / archive this program">
                                🗑️ Delete
                              </button>
                            `}
                            ${h.type !== 'membership' ? `
                              <button onclick="app.openScannerModal('${h.id}', 'entry')" class="btn btn-primary btn-sm" style="padding: 4px 8px; font-size: 11.5px; background: #0284c7; border-color: #0369a1;" title="Open live camera kiosk to scan attendance QR">
                                📷 Attendance
                              </button>
                              <button onclick="app.openScannerModal('${h.id}', 'gift')" class="btn btn-primary btn-sm" style="padding: 4px 8px; font-size: 11.5px; background: #d97706; border-color: #b45309;" title="Open live camera kiosk to verify gift collection QR">
                                🎁 Gift Kiosk
                              </button>
                              <button onclick="app.openDelegateTracker('${h.id}')" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 11.5px; border-color: rgba(56, 189, 248, 0.35); color: #38bdf8;" title="View delegates roster, mark check-ins and export list">
                                📊 Roster (${hPays.length})
                              </button>
                            ` : ''}
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Transactions Ledger with Filters & Dynamic Filtered Heads Totals -->
          <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 14px;">
              <div>
                <h3 style="font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px;">
                  <span>📑 Real-Time Tax Invoices & Payments Ledger</span>
                  <span class="badge" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);">
                    ${filteredCount} ${filteredCount === 1 ? 'Record' : 'Records'}
                  </span>
                </h3>
                <p style="font-size: 12.5px; color: var(--text-muted); margin-top: 3px;">
                  Audit ledger with real-time dynamic totals based on the selected head & payer filters.
                </p>
              </div>

              <!-- Filter Bar -->
              <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end;">
                <div>
                  <label style="font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 3px;">Filter Head:</label>
                  <select class="form-select" style="width: auto; padding: 6px 12px; font-size: 12px;" onchange="app.adminFilter.head = this.value; app.render();">
                    <option value="all">All Heads (${this.data.heads.length})</option>
                    ${this.data.heads.map(h => `<option value="${h.code}" ${this.adminFilter.head === h.code ? 'selected' : ''}>${h.code} - ${h.title.slice(0, 26)}...</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label style="font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 3px;">Payer Type:</label>
                  <select class="form-select" style="width: auto; padding: 6px 12px; font-size: 12px;" onchange="app.adminFilter.type = this.value; app.render();">
                    <option value="all" ${this.adminFilter.type === 'all' ? 'selected' : ''}>All Payers</option>
                    <option value="member" ${this.adminFilter.type === 'member' ? 'selected' : ''}>Members Only</option>
                    <option value="non_member" ${this.adminFilter.type === 'non_member' ? 'selected' : ''}>Guests Only</option>
                  </select>
                </div>

                <div>
                  <label style="font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 3px;">Search:</label>
                  <input type="text" placeholder="Search name, mobile, invoice..." value="${this.adminFilter.search}" oninput="app.adminFilter.search = this.value; app.render();" class="form-input" style="width: 190px; padding: 6px 10px; font-size: 12px;">
                </div>

                ${(this.adminFilter.head !== 'all' || this.adminFilter.type !== 'all' || this.adminFilter.search) ? `
                  <button onclick="app.resetAdminFilter()" class="btn btn-secondary btn-sm" style="padding: 6px 10px; font-size: 12px; color: #f87171;" title="Clear all active filters">

            </div>

            <div style="background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(24, 34, 53, 0.9) 100%); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 14px 18px; margin-bottom: 18px;">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 14px;">⚡</span>
                  <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #38bdf8;">

      async executePayment(headId, payerType, payerCategory, payerId, payerName, payerMobile, payerEmail, payerGstin = "", payerAddress = "") {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        if (head.status === 'deactivated' || head.status === 'inactive' || head.status === 'deleted' || head.isDeleted) {
          alert(`"${head.title}" is deactivated or deleted and cannot accept registrations.`);
          return;
        }

        if (head.activeUntil && new Date(head.activeUntil) < new Date()) {
          alert(`Registration cutoff for "${head.title}" has passed.`);
          return;
        }

        const base = Number(head.prices[payerCategory]);
        const cgst = Math.round(base * 0.09 * 100) / 100;
        const sgst = Math.round(base * 0.09 * 100) / 100;
        const totalGst = Math.round((cgst + sgst) * 100) / 100;
        const totalAmount = Math.round((base + totalGst) * 100) / 100;
        const fy = this.getFinancialYear();

        // Try calling server API
        try {
          const res = await fetch("/api/payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ headId, payerType, payerCategory, payerId, payerName, payerMobile, payerEmail, payerGstin, payerAddress })
          });
          if (res.ok) {
            const result = await res.json();
            // Refresh data from server
            const refreshed = await fetch("/api/data");
            const j = await refreshed.json();
            this.data = j.data;
            this.normalizeData();
            this.showPaymentSuccess(result.payment);
            return;
          }
        } catch(e) {}

        // Fallback offline execution
        const nextSerial = (this.data.invoiceCounter || 0) + 1;
        this.data.invoiceCounter = nextSerial;
        const serialStr = String(nextSerial).padStart(4, "0");
        const invoiceNo = `CREA/${fy.code}/${head.code.toUpperCase()}/${serialStr}`;

        const newPayment = {
          id: `pay-${Date.now()}`,
          invoiceNo,
          serial: nextSerial,
          date: new Date().toISOString(),
          headId: head.id,
          headCode: head.code,
          headTitle: head.title,
          payerType,
          payerCategory,
          payerId,
          payerName,
          payerMobile,
          payerEmail,
          payerGstin: payerGstin || "",
          payerAddress: payerAddress || "",
          baseAmount: base,
          cgst,
          sgst,
          totalGst,
          totalAmount,
          status: "success",
          method: "Simulated Gateway (Instant Checkout)",
          attended: false,
          attendedAt: null,
          giftCollected: false,
          giftCollectedAt: null
        };

        this.data.payments.unshift(newPayment);
        this.data.emailLogs.unshift({
          id: `log-${Date.now()}`,
          timestamp: new Date().toISOString(),
          recipient: payerEmail,
          recipientName: payerName,
          subject: `CREA(I) Official Tax Invoice ${invoiceNo} - ${head.title}`,
          invoiceNo,
          amount: totalAmount,
          status: "Dispatched (Simulated SMTP)"
        });

        // If membership payment, auto-activate the member offline
        const isMem = head.code === "MEM" || head.type === "membership" || (head.title && head.title.toLowerCase().includes("membership"));
        if (isMem && (payerId || payerMobile)) {
          const mem = this.data.members.find(m => m.id === payerId || m.mobile === payerMobile);
          if (mem) {
            mem.status = "active";
            mem.lastPaidFY = fy.code;
            mem.paymentMeans = "Online Gateway";
            mem.activationNote = `Paid Online (Invoice ${invoiceNo})`;
          }
          this.normalizeData();
        }

        this.saveToStorage();
        this.showPaymentSuccess(newPayment);
      },

      async downloadCertificateOffline(memberName, companyName) {
        if (!window.PDFLib) {
          window.location.href = `/api/certificate?name=${encodeURIComponent(memberName)}&company=${encodeURIComponent(companyName)}`;
          return;
        }
        try {
          const res = await fetch("assets/certificate/template_clean.pdf");
          const templateBytes = await res.arrayBuffer();
          const pdfDoc = await PDFLib.PDFDocument.load(templateBytes);
          const font = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRomanItalic);
          const boldFont = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRomanBold);
          const page = pdfDoc.getPage(0);
          page.drawText(memberName, { x: 350, y: 304, size: 28, font: font, color: PDFLib.rgb(0.1, 0.1, 0.1) });
          const firmText = '(' + (companyName.toLowerCase().startsWith('m/s') ? companyName : 'M/s. ' + companyName) + ')';
          page.drawText(firmText, { x: 570, y: 302, size: 13, font: boldFont, color: PDFLib.rgb(0.12, 0.12, 0.12) });
          const pdfBytes = await pdfDoc.save();
          const blob = new Blob([pdfBytes], { type: "application/pdf" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `CREA_Membership_Certificate_2026-27_${memberName.replace(/[^a-zA-Z0-9_-]/g, '_')}.pdf`;
          link.click();
        } catch(e) {
          window.location.href = `/api/certificate?name=${encodeURIComponent(memberName)}&company=${encodeURIComponent(companyName)}`;
        }
      },

          non_member: document.getElementById("price-non_member").value ? Number(document.getElementById("price-non_member").value) : null

          activeUntil,
          status: "active",
          prices,
          writeup

        this.render();

      extendEditDates(days) {
        const dateInput = document.getElementById("edit-head-date");
        const cutoffInput = document.getElementById("edit-head-active-until");
        const feedback = document.getElementById("date-extension-feedback");

        if (dateInput && dateInput.value) {
          const d = new Date(dateInput.value);
          d.setDate(d.getDate() + days);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const dt = String(d.getDate()).padStart(2, "0");
          dateInput.value = `${y}-${m}-${dt}`;
        }

        if (cutoffInput && cutoffInput.value) {
          const d = new Date(cutoffInput.value);
          d.setDate(d.getDate() + days);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const dt = String(d.getDate()).padStart(2, "0");
          const hr = String(d.getHours()).padStart(2, "0");
          const min = String(d.getMinutes()).padStart(2, "0");
          cutoffInput.value = `${y}-${m}-${dt}T${hr}:${min}`;
        }

        if (feedback) {
          feedback.style.display = "block";
          feedback.innerHTML = `✓ Schedule & cutoff extended by <strong>+${days} days</strong>. Click 'Save & Apply Changes' to finalize.`;
          setTimeout(() => { feedback.style.display = "none"; }, 4000);
        }
      },

      adjustEditPrice(tier, delta) {
        const input = document.getElementById(`edit-price-${tier}`);
        if (!input) return;
        let current = Number(input.value || 0);
        current = Math.max(0, current + delta);
        input.value = current;
        this.updateEditPriceGST(tier);
      },

      adjustAllEditPrices(delta) {
        ['associate_member', 'new_member', 'member', 'board_member', 'non_member'].forEach(tier => {
          const input = document.getElementById(`edit-price-${tier}`);
          if (input && input.value !== "") {
            let current = Number(input.value || 0);
            current = Math.max(0, current + delta);
            input.value = current;
            this.updateEditPriceGST(tier);
          }
        });
      },

      updateEditPriceGST(tier) {
        const input = document.getElementById(`edit-price-${tier}`);
        const preview = document.getElementById(`preview-${tier}`);
        if (!input || !preview) return;

        const val = String(input.value || "").trim();
        if (val === "" || isNaN(val)) {
          preview.innerHTML = `<span style="color: var(--text-dim);">Restricted (N/A)</span>`;
          return;
        }

        const base = Math.max(0, Number(val));
        const cgst = Math.round(base * 0.09 * 100) / 100;
        const sgst = Math.round(base * 0.09 * 100) / 100;
        const total = Math.round((base + cgst + sgst) * 100) / 100;

        preview.innerHTML = `Base: ₹${base.toLocaleString('en-IN')} + 18% GST: ₹${(cgst + sgst).toLocaleString('en-IN')}<br><strong style="color: #34d399;">Total: ₹${total.toLocaleString('en-IN')}</strong>`;
      },

      async saveModifiedHead(e, headId) {
        e.preventDefault();
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) {
          alert("Program / payment head not found.");
          return;
        }

        const title = document.getElementById("edit-head-title").value.trim();
        const code = document.getElementById("edit-head-code").value.trim().toUpperCase();
        const type = document.getElementById("edit-head-type").value;
        const status = document.getElementById("edit-head-status").value;
        const eventDate = document.getElementById("edit-head-date").value;
        const activeUntil = document.getElementById("edit-head-active-until").value;
        const eventTime = document.getElementById("edit-head-time").value.trim();
        const venue = document.getElementById("edit-head-venue").value.trim();
        const writeup = document.getElementById("edit-head-writeup").value.trim();

        const parsePrice = (id) => {
          const el = document.getElementById(id);
          const val = el ? String(el.value || "").trim() : "";
          if (val === "" || isNaN(val)) return null;
          return Number(val);
        };

        const assocVal = parsePrice("edit-price-associate_member") ?? parsePrice("edit-price-new_member");
        const prices = {
          associate_member: assocVal,
          new_member: assocVal,
          member: parsePrice("edit-price-member"),
          board_member: parsePrice("edit-price-board_member"),
          non_member: parsePrice("edit-price-non_member")
        };

        // Update properties
        head.title = title;
        head.code = code;
        head.type = type;
        head.status = status;
        head.eventDate = eventDate;
        head.eventTime = eventTime || head.eventTime || "Full Day";
        head.activeUntil = activeUntil;
        head.venue = venue;
        head.prices = prices;
        head.writeup = writeup;

        this.saveToStorage();

        // Also push to server if running
        try {
          await fetch("/api/head/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: head.id,
              title,
              code,
              type,
              status,
              eventDate,
              eventTime: head.eventTime,
              activeUntil,
              venue,
              prices,
              writeup
            })
          });
        } catch(err){}

        this.closeModal();
        this.render();
        alert(`✓ Program '${title}' modified and saved successfully!`);
      },

      async toggleHeadStatus(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        const currentStatus = head.status || 'active';
        const newStatus = (currentStatus === 'active') ? 'deactivated' : 'active';
        head.status = newStatus;

        this.saveToStorage();

        try {
          await fetch("/api/head/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: head.id, status: newStatus })
          });
        } catch(err){}

        this.render();
        if (newStatus === 'deactivated') {
          alert(`⏸ '${head.title}' has been DEACTIVATED.\n\nIt is now completely omitted and hidden from member and guest payment pages.`);
        } else {
          alert(`▶ '${head.title}' is now ACTIVE and open for registrations.`);
        }
      },

      async confirmDeleteHead(headId) {
        const head = this.data.heads.find(h => h.id === headId);
        if (!head) return;

        const hPays = (this.data.payments || []).filter(p => p.headId === headId || p.headCode === head.code);

        if (hPays.length > 0) {
          const ok = confirm(`⚠️ "${head.title}" has ${hPays.length} paid registration(s).\n\nTo protect official GST tax invoices, audit trails, and delegate entrance QR passes, deleting this program will:\n• Permanently omit it from member & guest payment pages\n• Block any new registrations\n• Safely preserve all ${hPays.length} tax invoices and QR entrance passes\n\nProceed with deleting this event?`);
          if (!ok) return;
          head.status = 'deleted';
        } else {
          const ok = confirm(`Are you sure you want to delete "${head.title}"?\n\nIt will be permanently removed from all payment pages.`);
          if (!ok) return;
          head.status = 'deleted';
        }

        this.saveToStorage();

        try {
          await fetch("/api/head/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: head.id })
          });
        } catch(err){}

        this.closeModal();
        this.render();
        alert(`🗑️ '${head.title}' has been deleted and completely removed from all payment pages.`);
      },

      async submitManualActivation(memberId) {
        const mem = this.data.members.find(m => m.id === memberId);
        if (!mem) return;

        const paymentMeans = document.getElementById("manual-pay-means").value;
        const description = (document.getElementById("manual-pay-note").value || "").trim();
        const createInvoice = document.getElementById("manual-create-inv").checked;

        if (!description) {
          alert("Please enter a payment description or transaction reference.");
          return;
        }

        const currentFY = this.getFinancialYear();
        const memHead = this.data.heads.find(h => h.code === "MEM" || h.type === "membership") || this.data.heads[0];

        mem.status = "active";
        mem.lastPaidFY = currentFY;
        mem.paymentMeans = paymentMeans;
        mem.activationNote = description;
        mem.deactivationReason = null;

        let generatedInvoiceNo = null;

        if (createInvoice && memHead) {
          const base = Number(memHead.prices[mem.category] || (mem.category === 'associate_member' ? 5000 : 10000));
          const cgst = Math.round(base * 0.09 * 100) / 100;
          const sgst = Math.round(base * 0.09 * 100) / 100;
          const totalGst = Math.round((cgst + sgst) * 100) / 100;
          const totalAmount = Math.round((base + totalGst) * 100) / 100;

          const nextSerial = (this.data.invoiceCounter || 0) + 1;
          this.data.invoiceCounter = nextSerial;
          const serialStr = String(nextSerial).padStart(4, "0");
          generatedInvoiceNo = `CREA/${currentFY}/${memHead.code.toUpperCase()}/${serialStr}`;

          const paymentRecord = {
            id: `pay-${Date.now()}`,
            invoiceNo: generatedInvoiceNo,
            serial: nextSerial,
            date: new Date().toISOString(),
            headId: memHead.id,
            headCode: memHead.code,
            headTitle: memHead.title,
            payerType: "member",
            payerCategory: mem.category,
            payerId: mem.id,
            payerName: mem.name,
            payerMobile: mem.mobile,
            payerEmail: mem.email,
            payerGstin: mem.gstin || "",
            payerAddress: mem.address || "",
            attended: false,
            giftCollected: false,
            baseAmount: base,
            cgst,
            sgst,
            totalGst,
            totalAmount,
            status: "success",
            method: `Manual Admin (${paymentMeans}): ${description}`
          };

          this.data.payments.unshift(paymentRecord);
        }

        try {
          await fetch("/api/member/activate-manual", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: memberId,
              paymentMeans,
              description,
              createInvoice,
              headId: memHead ? memHead.id : null
            })
          });
        } catch (err) {}

        this.normalizeData();
        this.saveToStorage();
        this.render();

        alert(`✓ Member '${mem.name}' has been successfully ACTIVATED for FY ${currentFY}!\n${generatedInvoiceNo ? `Tax Invoice ${generatedInvoiceNo} created.` : ''}`);
        this.openMembersModal();
      },

      async startScannerCamera(headId, mode) {
        this._scannerRunning = true;
        this._scannerLastScanTime = 0;
        const video = document.getElementById("scanner-video");
        const statusBox = document.getElementById("scanner-status");

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          this._scannerStream = stream;
          if (video) {
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            await video.play();
          }

          if (statusBox) statusBox.innerHTML = `🟢 <strong>Camera Active</strong>: Align QR code in frame...`;

          requestAnimationFrame(() => this.scanVideoLoop(headId, mode));
        } catch (err) {
          console.warn("Camera access failed or unavailable:", err);
          if (statusBox) {
            statusBox.innerHTML = `⚠️ <strong>Camera unavailable:</strong> ${err.message || 'Permission denied'}. Please use the manual fallback below.`;
            statusBox.style.color = "#f59e0b";
          }
        }
      },

      scanVideoLoop(headId, mode) {
        if (!this._scannerRunning) return;

        const video = document.getElementById("scanner-video");
        const canvas = document.getElementById("scanner-canvas");

        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
          if (!canvas) return;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

          if (window.jsQR) {
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "dontInvert"
            });

            if (code && code.data) {
              const now = Date.now();
              if (now - this._scannerLastScanTime > 2500) {
                this._scannerLastScanTime = now;
                this.handleScannedPayload(code.data, headId, mode);
              }
            }
          }
        }

        if (this._scannerRunning) {
          requestAnimationFrame(() => this.scanVideoLoop(headId, mode));
        }
      },

      handleScannedPayload(payload, headId, mode = 'attendance') {
        const clean = (payload || '').trim();
        let targetInvoice = clean;
        let targetMobile = null;

        if (clean.includes('|')) {
          const parts = clean.split('|');
          if (parts[0] === 'CREA' && parts.length >= 3) {
            const typeFlag = parts[1].toUpperCase();
            if (typeFlag === 'ENTRY') mode = 'attendance';
            if (typeFlag === 'GIFT') mode = 'gift';
            targetInvoice = parts[2];
            if (parts.length >= 5) targetMobile = parts[4];
          }
        }

        const head = this.data.heads.find(h => h.id === headId);
        const resultBox = document.getElementById("scanner-result");
        const statusBox = document.getElementById("scanner-status");

        const payment = this.data.payments.find(p =>
          p.invoiceNo.toUpperCase() === targetInvoice.toUpperCase() ||
          (targetMobile && p.payerMobile === targetMobile) ||
          p.payerMobile === targetInvoice ||
          p.id === targetInvoice ||
          clean.includes(p.invoiceNo.toUpperCase())
        );

        if (!payment) {
          this.playBeep('error');
          if (resultBox) {
            resultBox.style.display = "block";
            resultBox.innerHTML = `
              <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 8px; padding: 12px; color: #fca5a5; font-size: 13px;">
                <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">❌ INVALID TICKET</div>
                <div>No paid registration record found matching: <strong>${targetInvoice}</strong></div>
              </div>
            `;
          }
          if (statusBox) statusBox.innerHTML = `<span style="color: #ef4444;">❌ Scan Rejected: Unrecognized ticket.</span>`;
          return;
        }

        if (head && payment.headId && payment.headId !== head.id && payment.headCode !== head.code) {
          this.playBeep('warning');
          if (resultBox) {
            resultBox.style.display = "block";
            resultBox.innerHTML = `
              <div style="background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; border-radius: 8px; padding: 12px; color: #fde68a; font-size: 13px;">

        if (mode === 'attendance') {
          if (!payment.attended) {

                  <div style="font-size: 11px; color: #a7f3d0; margin-top: 4px;">

          } else {

            if (resultBox) {

                <div style="background: rgba(56, 189, 248, 0.15); border: 2px solid #38bdf8; border-radius: 10px; padding: 14px; color: #bae6fd;">
                  <div style="font-weight: 800; font-size: 16px; color: #38bdf8; margin-bottom: 6px;">
                    ℹ️ RE-ENTRY PERMITTED
                  </div>

                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">

      closeScannerModal(event) {
